# Tremor basket configuration.
#
# WHAT A BLOCK IS FOR. A block is a claim that its members respond to the same
# thing with the same sign. The jump detector reads each instrument on its own;
# the blocks group the reports (tools/stage_report.py). The co-jump and own-move
# stages that would have tested against them were measured and dropped
# (docs/decisions.md, "Settled and closed").
# The previous detector modelled every instrument against its block's median,
# and the measurements behind the composition below come from that; its notes
# on the model are on the production branch.
#
# WHY THE BLOCKS LOOK LIKE THIS. Commercial multi-asset risk models do not use
# one global factor either: they build a factor block per asset class and model
# the blocks jointly, on the stated assumption that all the risk factors inside a
# block share their time-series behaviour. Within equity the standard
# substructure is the eleven GICS sectors; within commodities it is the GSCI
# sectors - energy, precious metals, industrial metals, agriculture. That is what
# is below.
#
# The one block that used to break its own rule was rates, which held HYG. High
# yield is credit risk, and credit risk trades like equity, not like duration:
# HYG's block factor explained 8% of its spread against SPY's 63%, and the basket
# factor was the only thing carrying it - which is exactly why it looked like the
# best argument for keeping the basket. It now sits in a credit block beside JNK,
# LQD, EMB, BKLN and PFF, where its peers are actually its peers.
#
# Weights are DELIBERATELY absent. They are derived from the composition under
# the equality rule
#     weight_i = 1 / (N_blocks * N_assets_block)
# and a stored weight could be hand-edited out of line with the rule, so the only
# way never to diverge is not to store it. Nothing in the jump detector reads
# them.
#
# Which provider carries what, and why, is below (WHAT THIS COSTS, HOURLY) and in
# docs/decisions.md ("The data").

# Anchor exchange of the basket's reference calendar: Sun 17:00 .. Fri 17:00
# local time. The bounds are stored in this timezone and converted to UTC on the
# fly - they must not be stored as UTC.
anchor_exchange_tz: America/New_York

# Start of history. Matches the train period - this is the ANALYSIS floor, and
# moving it moves the evaluation window.
history_since: "2015-01-01"

# The ACQUISITION floor, which is a different question: take whatever the
# sources will still give, whether or not the analysis reaches it yet. Free
# archives freeze, so bars not taken now may not be takeable later, and storing
# history the analysis does not use costs nothing but disk. Each source stops at
# its own limit on its own (see tremor.backfill and price_monitor.dukascopy), so
# a floor deeper than anything
# available is simply the instruction "as deep as you can".
#
# WHICH SOURCE REACHES HOW FAR BACK, because it is not one answer and getting it
# wrong wastes a day of credits:
#   Twelve Data   intraday stops at 2020-02 for every ETF at once, whatever the
#                 ticker's real age. This is the ordinary --extend-history pass.
#   HF Data       2002 to 2020-02 for US equity, from the consolidated tape.
#                 This is the --deepen-etfs pass, it spends no Twelve Data
#                 credits, and it is the ONLY way an ETF here reaches 2002. The
#                 library switches to IEX-only data in March 2022 and the module
#                 refuses those bars outright - see price_monitor.hfdata.
#   Dukascopy     2003 for the currency pairs (--deepen-dukascopy), no key.
#   Binance       each pair's own listing date (2017-08 at the earliest), no key.
# So a newly added ETF needs BOTH Twelve Data passes and the HF Data one before
# its history is comparable with SPY's.
fetch_since: "2002-01-01"

# ---------------------------------------------------------------------------
# THE JUMP DETECTOR (tremor/jumps.py), built in stages (docs/architecture.md).
# Its score is the jump test of Lee & Mykland (2008):
#
#   z = the hour's move / the instrument's bipower volatility over the
#       window_days before it (calendar time, the same for every instrument)
#   the word from |z|: noticeable at noticeable_sigma, and each word above it
#       `step` times bigger - 3.9, 5.5, 7.8, 11.0 with the settings below.
#
# window_days: half a year, inside the paper's valid range for every calendar.
# noticeable_sigma: 3.9 for now, to be tuned at the end against the exact 99%
#   level. step: sqrt(2), half an earthquake magnitude per word.
detector:
  window_days: 182.6
  noticeable_sigma: 3.9
  step: 1.414

