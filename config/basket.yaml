# Tremor basket configuration: the instruments, their blocks and providers, and
# the detector's settings. The source of truth; docs/manual.md describes it.
#
# BLOCKS group instruments that answer to the same news: the GICS sectors within
# equity, the GSCI sectors within commodities (energy, precious metals,
# industrial metals, agriculture), credit apart from rates because high yield
# trades like equity, not duration. The detector reads each instrument on its
# own; blocks group the reports (tools/stage_report.py) and the alternation of
# the funds' feeds.

# Anchor exchange of the basket's reference calendar: Sun 17:00 .. Fri 17:00
# local time. The bounds are stored in this timezone and converted to UTC on the
# fly - they must not be stored as UTC.
anchor_exchange_tz: America/New_York

# history_since: required; the fallback for fetch_since.
history_since: "2015-01-01"

# fetch_since: how deep to acquire history. Take whatever the sources will still
# give: free archives freeze, and bars not taken now may not be takeable later.
# Each source stops at its own limit, so a floor deeper than anything available
# means "as deep as you can".
#
# WHICH SOURCE REACHES HOW FAR BACK, because it is not one answer and getting it
# wrong wastes a day of credits:
#   Twelve Data   intraday stops at 2020-02 for every ETF at once, whatever the
#                 ticker's real age. This is the ordinary --extend-history pass.
#   HF Data       2002 to 2020-02 for US equity, from the consolidated tape.
#                 This is the --deepen-etfs pass, it spends no Twelve Data
#                 credits, and it is the ONLY way an ETF here reaches 2002. The
#                 library switches to IEX-only data in March 2022 and the module
#                 refuses those bars outright - see price_monitor.hfdata.
#   Dukascopy     2003 for the currency pairs (--deepen-dukascopy), no key.
#   Binance       each pair's own listing date (2017-08 at the earliest), no key.
# So a newly added ETF needs BOTH Twelve Data passes and the HF Data one before
# its history is comparable with SPY's.
fetch_since: "2002-01-01"

# ---------------------------------------------------------------------------
# THE JUMP DETECTOR (tremor/jumps.py), the jump test of Lee & Mykland (2008):
#
#   z = the move / the instrument's bipower volatility over the window_days
#       before it (calendar time, the same for every instrument)
#   the word from |z|: noticeable, high, major, extreme at the four `levels`.
#
# window_days: half a year, inside the paper's valid range for every calendar.
# levels: about sqrt(2) apart, each word about three times rarer than the one
#   below; the bottom sets the volume (docs/decisions.md, "The detector").
detector:
  window_days: 182.6
  levels: [6.0, 8.5, 12.0, 17.0]

# Session templates: here only the names the assets refer to; the calendars
# are in tremor/sessions.py and data/tremor/sessions/.
session_templates:
  us_equity:
    exchange: NYSE
    tz: America/New_York
    description: "09:30-16:00 on business days, with NYSE holidays and half sessions"
  fx_continuous:
    exchange: FX
    tz: America/New_York
    description: "continuous from Sun 17:00 to Fri 17:00"
  crypto_24_7:
    exchange: BINANCE
    tz: UTC
    description: "around the clock, no weekends"
  # The daily sessions below are defined in tremor/sessions.py DAILY_SESSIONS;
  # here only named, for the instruments to refer to.
  lme:
    exchange: LME
    tz: Europe/London
    description: "01:00-19:00 London on weekdays (LMEselect); holidays are the days the quote never moves"
  ice_coffee:
    exchange: ICE US
    tz: America/New_York
    description: "04:15-13:30 New York on weekdays"
  ice_cocoa:
    exchange: ICE US
    tz: America/New_York
    description: "04:45-13:30 New York on weekdays"
  ice_cotton:
    exchange: ICE US
    tz: America/New_York
    description: "21:00-14:20 New York, the session opening the evening before"
  cme_cattle:
    exchange: CME
    tz: America/Chicago
    description: "08:30-13:05 Chicago on weekdays"
  b3_fx:
    exchange: B3
    tz: America/Sao_Paulo
    description: "09:00-18:00 Sao Paulo on weekdays, the onshore dollar market"

# tick_size is the exchange price step, stated rather than measured: a source
# serves ETF prices with a floating tail (769.53992 for 769.54). The bar gate
# allows half a tick of rounding between a bar's fields (tremor.quality), and the
# coverage report flags a step finer than the source's precision. For crypto it
# is the pair's tick on Binance (exchangeInfo PRICE_FILTER).
#
# fetch_interval is the interval at which the instrument is REQUESTED from the
# source; it is not the system's working interval. ETF bars run on the :30
# (09:30, 10:30, ...), so they are pulled as half-hourly and folded into hourly
# bars on the round UTC hour - otherwise the cross-section would measure synchrony
# on series offset from one another by half an hour. This costs no credits: the
# plan counts requests, not rows.
#
# WHAT THIS COSTS, HOURLY - each quota kept under about 85%, so tests and
# backfills have room (docs/manual.md, "Running it"):
#   Tiingo       27 IEX-safe funds, of its 50 requests an hour;
#   Alpaca       30 more IEX-safe funds, free IEX bars, 30 of 200 a minute;
#   Twelve Data  8 thin funds that need the consolidated tape - one batched
#                request a run (its 8 credits a minute), in a thread beside the
#                other providers;
#   SiftingIO    the 17 FX pairs, ~85% of 10,000 a month;
#   Sina, Yahoo  the remaining 67 funds, alternating within each block so an
#                outage of either leaves every block reporting;
#   Google TUR; Sina the LME metals; Yahoo 4 futures; Binance the 16 coins.
# Instruments whose market is shut are not asked
# (tremor.backfill.nothing_can_have_appeared).
#
# SOURCE IS THE STORE; PROVIDER IS THE SERVER. `source` is the identity: the
# asset_id and the file on disk are built from it, so it is never edited when
# the fetch moves. `provider` says who is asked, and changes freely.
#
# WHICH PROVIDER: measured against the stored bars hour by hour in basis points
# (docs/decisions.md, "Data and providers"). A fund goes to an IEX-only feed
# (Tiingo, Alpaca) only where IEX prices it like the consolidated tape.
# Twelve Data keeps the archive and serves --fill-gaps and --extend-history.
