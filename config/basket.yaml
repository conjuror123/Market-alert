# Instruments outside the basket: scored and delivered like any other, but kept
# out of the basket's block counts. block is still required.
outside_basket:
  # A broad commodity index, about 55% energy: it belongs to no one block.
  - ticker: DBC
    source: twelvedata
    provider: twelvedata
    tier: 2
    block: energy
    has_volume: true
    tick_size: 0.01
    session_template: us_equity
    fetch_interval: 30min
    label: "Broad commodity basket"

# The VIX: FRED's VIXCLS, the index itself from 1990, shown on the weekly note
# as a level ranked in its own history - the regime the week's moves happened
# in (price_monitor.tremor_delivery.vix_context). Daily,
# and published a business day or two late, so each value is used from when it
# became known (`available_at`), never from its observation date. Its own
# history_since: the series is free back to 1990.
volatility_index:
  series_id: VIXCLS
  source: fred
  interval: 1d
  history_since: "1990-01-01"
  label: "VIX volatility index"
