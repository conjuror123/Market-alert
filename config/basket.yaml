# tick_size is the exchange price step, needed by the winsorization (the eps_MAD
# floor includes the return on half a tick). It is stated explicitly rather than
# measured from the data: the source serves ETF prices with a floating tail -
# 769.53992 where the exchange shows 769.54 - so a measured precision of 1e-7
# describes the vendor's storage format, not the trading step. For currency pairs
# the source precision and the step coincide: five decimals, the yen included
# (verified on real data). For crypto the step is the pair's own tick size
# as Binance publishes it (exchangeInfo PRICE_FILTER), which is not 0.01 for every
# pair - DOGE and POL quote to five decimals. The audit cross-checks the two and complains if the step is
# finer than the precision.
#
# fetch_interval is the interval at which the instrument is REQUESTED from the
# source; it is not the system's working interval. ETF bars run on the :30
# (09:30, 10:30, ...), so they are pulled as half-hourly and folded into hourly
# bars on the round UTC hour - otherwise the cross-section would measure synchrony
# on series offset from one another by half an hour. This costs no credits: the
# plan counts requests, not rows.
#
# WHAT THIS COSTS, HOURLY - each quota kept well under its limit, so tests and
# backfills have room (docs/architecture.md, "Where the bars come from"):
#   Tiingo       27 IEX-safe funds of its 50 requests an hour (shared with
#                production until the switch);
#   Alpaca       30 more IEX-safe funds, free IEX bars, 30 of 200 a minute;
#   Twelve Data  8 thin funds that need the consolidated tape, one or two in
#                each commodity block - one batched request a run (its 8
#                credits a minute), in a thread beside the other providers,
#                ~65 of 800 credits a day;
#   SiftingIO    the 17 FX pairs, ~520 a month each (USD/BRL in its session), ~85% of 10,000;
#   Sina, Yahoo  the remaining 67 thin funds, split within each block so an
#                outage of either leaves every block reporting - both the
#                consolidated tape, both undocumented, neither with a quota;
#   Google TUR; Sina the LME metals; Yahoo 4 futures; Binance the 16 coins (USDT pairs).
# US-session names skip when the NYSE calendar says no bar can have appeared;
# FX skips when the Sun 17:00-Fri 17:00 New York week is shut - see
# tremor.backfill.nothing_can_have_appeared. History below 2020-02 is HF Data
# (2002) and Alpaca's SIP (2016), once.
#
# SOURCE IS THE STORE; PROVIDER IS THE SERVER. `source` names the identity: both
# the asset_id and the file on disk are built from it, so every bar ever stored,
# every exported event is keyed by it. It is not
# edited when the fetch moves. `provider` says who is actually asked, and it can
# change freely - the bars land in the same place either way.
#
# WHY THEY DIFFER NOW. Twelve Data's free tier allows 8 requests a minute, which
# the backfill honours with an 8-second pause between instruments. For 52 symbols
# that pause was the entire run: 416 seconds of deliberate waiting. The other two
# providers have no enforced pace, so the run is now about 12 seconds.
#
# WHICH PROVIDER, AND ON WHAT EVIDENCE. Each instrument was fetched from both
# candidates and compared against the bars already stored, hour by hour, in basis
# points - the full table is in docs/tiingo-findings.md.
#
#   tiingo  the ETFs whose IEX-only price matches the consolidated tape.
#   sifting the currency pairs, since 2026-09-30: against the stored bars over
#           300 hours, 0.11-0.35 bps median (Tiingo measured 0.43-1.57), the
#           bar closed at :00 is served by :05 on the free tier, and it carries
#           the EM pairs nothing else here does (price_monitor/sifting.py).
#   yahoo   the fifteen ETFs where IEX is NOT the same price. These are thin
#           commodity and credit funds where one exchange's slice of the tape
#           diverges: SOYB by 7.2 bps, UGA by 7.97 with a worst hour of 76.8,
#           which is about two sigma and would be delivered as a move that never
#           happened. Yahoo matches the store at 0.00 bps median on all of them.
#
# Twelve Data still holds the archive and still serves --fill-gaps and
# --extend-history: Yahoo caps intraday lookback at 55 days and Tiingo caps a
# response at 10000 rows, so neither can deepen history however fast they answer.
