# MEALS basket configuration (spec 5.1, §2.3).
#
# Weights are DELIBERATELY absent here: per §2.3 they are derived, computed by
# the system from the composition on a date under the equality rule
#     weight_i = 1 / (N_blocks * N_assets_block)
# If a weight lived in this file, someone could hand-edit it out of line with the
# rule - and the spec then declares the configuration invalid, so the only way
# never to diverge is not to store it.
#
# There are five blocks, not the four of the original §2.3. The fifth, crypto,
# was added on purpose: without it, outside the US session the basket holds only
# currency pairs, that is, one block, while the hourly quorum requires at least
# two blocks of two assets each. Six pairs plus three crypto assets give nine
# assets at night against a minimum of eight - a margin of exactly one invalid
# bar. Without this block the system would be blind for roughly 17 hours a day.
#
# There are three sources. Yahoo Finance is not used in MEALS at all: every one
# of its instruments duplicated something already covered by an ETF (GC=F and GLD
# are the same gold, CL=F and USO the same oil, ES=F and SPY the same S&P, ZB=F
# and TLT/IEF the same long Treasuries, DX-Y.NYB the same currency pairs in
# different packaging), and with history only from April 2024 and through an
# unofficial endpoint.

# Anchor exchange of the basket's reference calendar (§2.2): Sun 17:00 .. Fri
# 17:00 local time. The bounds are stored in this timezone and converted to UTC
# on the fly - §2.2 forbids storing them as UTC.
anchor_exchange_tz: America/New_York

# Start of history (§2.1). Matches the train period of §7.
history_since: "2015-01-01"

# Session templates are filled in during phase 1 (holiday and half-session
# calendars); here only the names the assets refer to.
session_templates:
  us_equity:
    exchange: NYSE
    tz: America/New_York
    description: "09:30-16:00 on business days, with NYSE holidays and half sessions"
  fx_continuous:
    exchange: FX
    tz: America/New_York
    description: "continuous from Sun 17:00 to Fri 17:00"
  crypto_24_7:
    exchange: COINBASE
    tz: UTC
    description: "around the clock, no weekends"

# tick_size is the exchange price step, needed by the §2.5 winsorization (the
# eps_MAD floor includes the return on half a tick). It is stated explicitly
# rather than measured from the data: the source serves ETF prices with a
# floating tail - 769.53992 where the exchange shows 769.54 - so a measured
# precision of 1e-7 describes the vendor's storage format, not the trading step.
# For currency pairs the source precision and the step coincide: five decimals,
# the yen included (verified on real data). The audit cross-checks the two and
# complains if the step is finer than the precision.
#
# fetch_interval is the interval at which the instrument is REQUESTED from the
# source; it is not the system's working interval. ETF bars run on the :30
# (09:30, 10:30, ...), so they are pulled as half-hourly and folded into hourly
# bars on the round UTC hour - otherwise the cross-section would measure synchrony
# on series offset from one another by half an hour. This costs no credits: the
# plan counts requests, not rows.
assets:
  # --- equity -------------------------------------------------------------
  - ticker: SPY
    source: twelvedata
    tier: 1
    block: equity
    has_volume: true
    tick_size: 0.01
    session_template: us_equity
    fetch_interval: 30min
    label: "S&P 500"
  - ticker: QQQ
    source: twelvedata
    tier: 1
    block: equity
    has_volume: true
    tick_size: 0.01
    session_template: us_equity
    fetch_interval: 30min
    label: "Nasdaq 100"
  - ticker: IWM
    source: twelvedata
    tier: 2
    block: equity
    has_volume: true
    tick_size: 0.01
    session_template: us_equity
    fetch_interval: 30min
    label: "Russell 2000 (small caps)"
  - ticker: XLF
    source: twelvedata
    tier: 2
    block: equity
    has_volume: true
    tick_size: 0.01
    session_template: us_equity
    fetch_interval: 30min
    label: "US financial sector"

  # --- rates --------------------------------------------------------------
  - ticker: TLT
    source: twelvedata
    tier: 1
    block: rates
    has_volume: true
    tick_size: 0.01
    session_template: us_equity
    fetch_interval: 30min
    label: "Treasuries 20+ years"
  - ticker: IEF
    source: twelvedata
    tier: 1
    block: rates
    has_volume: true
    tick_size: 0.01
    session_template: us_equity
    fetch_interval: 30min
    label: "Treasuries 7-10 years"
  - ticker: SHY
    source: twelvedata
    tier: 2
    block: rates
    has_volume: true
    tick_size: 0.01
    session_template: us_equity
    fetch_interval: 30min
    label: "Treasuries 1-3 years"
  - ticker: HYG
    source: twelvedata
    tier: 2
    block: rates
    has_volume: true
    tick_size: 0.01
    session_template: us_equity
    fetch_interval: 30min
    label: "High-yield bonds (credit risk)"

  # --- commodities --------------------------------------------------------
  - ticker: GLD
    source: twelvedata
    tier: 1
    block: commodities
    has_volume: true
    tick_size: 0.01
    session_template: us_equity
    fetch_interval: 30min
    label: "Gold"
  - ticker: USO
    source: twelvedata
    tier: 1
    block: commodities
    has_volume: true
    tick_size: 0.01
    session_template: us_equity
    fetch_interval: 30min
    label: "WTI crude oil"
  - ticker: SLV
    source: twelvedata
    tier: 2
    block: commodities
    has_volume: true
    tick_size: 0.01
    session_template: us_equity
    fetch_interval: 30min
    label: "Silver"
  - ticker: DBC
    source: twelvedata
    tier: 2
    block: commodities
    has_volume: true
    tick_size: 0.01
    session_template: us_equity
    fetch_interval: 30min
    label: "Broad commodity basket"

  # --- FX -----------------------------------------------------------------
  # Spot FX has no consolidated exchange volume at any provider, hence
  # has_volume: false - per §3.5 volume confirmation for them is not assessed at
  # all (V_R = NULL), rather than counted as having failed.
  - ticker: EUR/USD
    source: twelvedata
    tier: 1
    block: FX
    has_volume: false
    tick_size: 0.00001
    session_template: fx_continuous
    fetch_interval: 1h
    label: "Euro / dollar"
  - ticker: USD/JPY
    source: twelvedata
    tier: 1
    block: FX
    has_volume: false
    tick_size: 0.00001
    session_template: fx_continuous
    fetch_interval: 1h
    label: "Dollar / yen"
  - ticker: GBP/USD
    source: twelvedata
    tier: 2
    block: FX
    has_volume: false
    tick_size: 0.00001
    session_template: fx_continuous
    fetch_interval: 1h
    label: "Pound / dollar"
  - ticker: AUD/USD
    source: twelvedata
    tier: 2
    block: FX
    has_volume: false
    tick_size: 0.00001
    session_template: fx_continuous
    fetch_interval: 1h
    label: "Australian dollar / dollar"
  - ticker: USD/CHF
    source: twelvedata
    tier: 2
    block: FX
    has_volume: false
    tick_size: 0.00001
    session_template: fx_continuous
    fetch_interval: 1h
    label: "Dollar / franc"
  - ticker: USD/CAD
    source: twelvedata
    tier: 2
    block: FX
    has_volume: false
    tick_size: 0.00001
    session_template: fx_continuous
    fetch_interval: 1h
    label: "Dollar / Canadian dollar"

  # --- crypto -------------------------------------------------------------
  - ticker: BTC-USD
    source: coinbase
    tier: 1
    block: crypto
    has_volume: true
    tick_size: 0.01
    session_template: crypto_24_7
    fetch_interval: 1h
    label: "Bitcoin"
  - ticker: ETH-USD
    source: coinbase
    tier: 2
    block: crypto
    has_volume: true
    tick_size: 0.01
    session_template: crypto_24_7
    fetch_interval: 1h
    label: "Ethereum"

# Instruments outside the basket (§8.1): they take no part in the quorum, the
# weights, breadth or the cluster triggers, but SAED computes their residuals on
# the common basket factor. block is mandatory - it is needed only for block-alert
# aggregation per §8.4. These two pairs were moved out of the basket so as not to
# skew the FX block by headcount, while their alerts are preserved.
outside_basket:
  # Moved out of the basket, not deleted: Coinbase listed SOL on 2021-06-14 and it
  # did not exist before, so it alone held the crypto block - and with it the
  # basket's history - at 2021. Out here the floor becomes ETH's 2016-05-18 and
  # the block still has its two members, so the quorum is untouched: 70.6% of
  # hours pass it either way, measured. Bars keep being collected and SAED keeps
  # producing its alerts, which is where a single asset matters anyway.
  - ticker: SOL-USD
    source: coinbase
    tier: 2
    block: crypto
    has_volume: true
    tick_size: 0.01
    session_template: crypto_24_7
    fetch_interval: 1h
    label: "Solana"
  - ticker: NZD/USD
    source: twelvedata
    tier: 2
    block: FX
    has_volume: false
    tick_size: 0.00001
    session_template: fx_continuous
    fetch_interval: 1h
    label: "New Zealand dollar / dollar"
  - ticker: USD/CNY
    source: twelvedata
    tier: 2
    block: FX
    has_volume: false
    tick_size: 0.00001
    session_template: fx_continuous
    fetch_interval: 1h
    label: "Dollar / yuan"

# External one-sided stress indicator (§4.4). Not part of the basket and takes no
# part in the quorum. Source: FRED, series VIXCLS - the real index going back to
# 1990, without the contango drift of ETFs on VIX futures.
#
# Two peculiarities, both recorded as departures from the letter of §4.4:
#   1. The series is DAILY - FRED has no intraday VIX in any series, so a spike is
#      identified by the §3.1 machinery on daily bars, not hourly ones.
#   2. It is published with a one- to two-business-day delay, so the multiplier
#      window is counted from the moment the value became known to the system, not
#      from the observation date. Otherwise the backtest would look ahead.
# history_since here is ITS OWN, different from the basket's, and that is not
# sloppiness. The §2.7 burn-in needs 720 observations before sigma_LT appears, and
# for a daily series that is almost three years. Starting from 2021 we would get a
# working multiplier only from October 2023 - that is, across the entire §7 train
# period it would silently equal one, and threshold calibration would run on a
# series in which stress regimes appear not to exist. VIX is not in the basket, so
# the §2.1 limit on the basket's history depth does not apply to it, and FRED
# serves the series from 1990 for free.
volatility_index:
  series_id: VIXCLS
  source: fred
  interval: 1d
  history_since: "1990-01-01"
  label: "VIX volatility index"
