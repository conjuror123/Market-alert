# Instruments outside the basket: they take no part in the quorum, the weights or
# breadth, but they get residuals and events like anything else. block is
# mandatory - it decides which block factor they are modelled against, and unlike
# a basket member they use the WHOLE block median, since there is nothing of
# theirs in it to leave out.
outside_basket:
  # A broad commodity index is roughly 55% energy, the rest metals and
  # agriculture, so it belongs to no block and cannot be a member of one without
  # dragging that block's median toward the others. Out here it keeps its alerts
  # and is modelled against energy, the largest thing inside it.
  - ticker: DBC
    source: twelvedata
    provider: yahoo
    tier: 2
    block: energy
    has_volume: true
    tick_size: 0.01
    session_template: us_equity
    fetch_interval: 30min
    label: "Broad commodity basket"

# External one-sided stress indicator. Not part of the basket and takes no part
# in the quorum. Source: FRED, series VIXCLS - the real index going back to 1990,
# without the contango drift of ETFs on VIX futures.
#
# THE LEVEL OF FEAR, AND NOTHING ELSE. VIXY, the tradable futures product, was
# briefly listed as a watched instrument here so that fear could be read in the
# same hour as a move. It was removed, on two grounds measured rather than
# assumed.
#
# It could not have earned a message. It belongs to the equity block, so its
# events land on the days the equity block moves and collapse into that push -
# it would have contributed one more line, never an interruption of its own.
#
# And that line would have been the least trustworthy in the block. Measured
# across 5956 trading days, the residual a linear beta leaves on days the S&P
# moved more than 3% is systematically signed: -2.35 sigma on the down days and
# +4.18 sigma on the up ones. Ordinary members show the same shape - XLF is
# -1.63 and +2.10, IEF +2.19 and -1.65 - so this is a difference of degree and
# not of kind, but VIX is the worst of them by roughly a factor of two, and what
# the residual would mostly be reporting is that the beta was fitted on quiet
# hours.
#
# What a reader wants from VIX is the regime, not a residual: "this happened
# with VIX at 34, having been 17 last week". That is a level, it moves slowly
# enough for a daily series to carry it, and FRED serves it back to 1990.
#
# Two peculiarities of the FRED series, both departures from the letter of the
# spec:
#   1. It is DAILY, so a spike is identified on daily bars, not hourly ones.
#   2. It is published with a one- to two-business-day delay, so the multiplier
#      window is counted from the moment the value became known to the system,
#      not from the observation date. Otherwise the backtest would look ahead.
# history_since here is ITS OWN, different from the basket's, and that is not
# sloppiness. The burn-in needs 720 observations before sigma_LT appears, and for
# a daily series that is almost three years. Starting from 2021 we would get a
# working multiplier only from October 2023 - that is, across the entire train
# period it would silently equal one, and threshold calibration would run on a
# series in which stress regimes appear not to exist. VIX is not in the basket,
# so the limit on the basket's history depth does not apply to it, and FRED
# serves the series from 1990 for free.
volatility_index:
  series_id: VIXCLS
  source: fred
  interval: 1d
  history_since: "1990-01-01"
  label: "VIX volatility index"
