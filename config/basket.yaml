# Tremor basket configuration.
#
# WHAT A BLOCK IS FOR. Every instrument here is modelled against the median of
# its own block, and against nothing else:
#
#     r = alpha + beta_block * B + e
#
# So a block is not a filing category. It is a claim that its members respond to
# the same thing with the same sign, because a median only stands for a common
# move when they do. That claim is what the composition below is chosen to make
# true, and it is why the blocks are narrower than they used to be.
#
# WHAT USED TO BE HERE AND IS NOT. A second regressor, the weighted median of the
# whole basket, meant as the "everything de-risks at once" factor. Such a factor
# is real - it is the first principal component of a multi-asset panel, and it is
# what 2008 and March 2020 look like - but a median cannot carry it, because that
# factor has SIGNS: equities down, Treasuries up, gold up. A median assumes its
# members all move the same way, so on exactly the days the common factor is
# strongest, stocks and bonds cancelled and the factor read near nothing.
#
# It could not be repaired by orienting the blocks the way the FX block is
# oriented, either. The equity-rates correlation is not a constant to hard-code:
# measured on the block medians it runs -0.66 in 2002 and -0.42 in 2008, and then
# FLIPS after the 2022 inflation shock to +0.24, +0.28, +0.43. A fixed sign would
# be right for twenty years and wrong for the last four; a rolling one is a
# principal component with extra steps.
#
# Dropping it was measured, not assumed. Adding the basket component back into
# every residual - which is what a block-only fit leaves, since least squares
# makes the fitted parts orthogonal to the residual - moved the hours where three
# or more instruments exceed four sigma at once from 610 to 645 in twenty-one
# years, and the mean absolute correlation between standardised residuals from
# 0.146 to 0.161. The rarity ladder is fitted to each instrument's own residual
# tail, so a uniform rise in residual sigma rescales away entirely and the alert
# rate is unchanged; only the clustering moves, and the same-day collapse folds
# most of that into one message anyway.
#
# WHY THE BLOCKS LOOK LIKE THIS. Commercial multi-asset risk models do not use
# one global factor either: they build a factor block per asset class and model
# the blocks jointly, on the stated assumption that all the risk factors inside a
# block share their time-series behaviour. Within equity the standard
# substructure is the eleven GICS sectors; within commodities it is the GSCI
# sectors - energy, precious metals, industrial metals, agriculture. That is what
# is below.
#
# The one block that used to break its own rule was rates, which held HYG. High
# yield is credit risk, and credit risk trades like equity, not like duration:
# HYG's block factor explained 8% of its spread against SPY's 63%, and the basket
# factor was the only thing carrying it - which is exactly why it looked like the
# best argument for keeping the basket. It now sits in a credit block beside JNK,
# LQD, EMB, BKLN and PFF, where its peers are actually its peers.
#
# Weights are DELIBERATELY absent. They are derived from the composition under
# the equality rule
#     weight_i = 1 / (N_blocks * N_assets_block)
# and a stored weight could be hand-edited out of line with the rule, so the only
# way never to diverge is not to store it. They no longer enter the model at all
# - a block median is unweighted, since within a block the rule makes every
# weight equal - and survive only for the cross-sectional diagnostics (breadth,
# CSV, PC1) that feed the cluster channel.
#
# There are two price sources. Yahoo Finance is not used in Tremor at all: every
# one of its instruments duplicated something already covered by an ETF, with
# history only from April 2024 and through an unofficial endpoint.

# Anchor exchange of the basket's reference calendar: Sun 17:00 .. Fri 17:00
# local time. The bounds are stored in this timezone and converted to UTC on the
# fly - they must not be stored as UTC.
anchor_exchange_tz: America/New_York

# Start of history. Matches the train period - this is the ANALYSIS floor, and
# moving it moves the evaluation window.
history_since: "2015-01-01"

# The ACQUISITION floor, which is a different question: take whatever the
# sources will still give, whether or not the analysis reaches it yet. Free
# archives are not permanent - FXCM's stopped updating in April 2026 - so bars
# not taken now may not be takeable later, and storing history the analysis does
# not use costs nothing but disk. Each source stops at its own limit on its own
# (see tremor.backfill and price_monitor.fxcm), so a floor deeper than anything
# available is simply the instruction "as deep as you can".
#
# WHICH SOURCE REACHES HOW FAR BACK, because it is not one answer and getting it
# wrong wastes a day of credits:
#   Twelve Data   intraday stops at 2020-02 for every ETF at once, whatever the
#                 ticker's real age. This is the ordinary --extend-history pass.
#   HF Data       2002 to 2020-02 for US equity, from the consolidated tape.
#                 This is the --deepen-etfs pass, it spends no Twelve Data
#                 credits, and it is the ONLY way an ETF here reaches 2002. The
#                 library switches to IEX-only data in March 2022 and the module
#                 refuses those bars outright - see price_monitor.hfdata.
#   Dukascopy     2003 for the currency pairs (--deepen-dukascopy), no key.
#   Coinbase      each pair's own listing date, no key and no credits.
# So a newly added ETF needs BOTH Twelve Data passes and the HF Data one before
# its history is comparable with SPY's.
fetch_since: "2002-01-01"

# Session templates are filled in during phase 1 (holiday and half-session
# calendars); here only the names the assets refer to.
session_templates:
  us_equity:
    exchange: NYSE
    tz: America/New_York
    description: "09:30-16:00 on business days, with NYSE holidays and half sessions"
  fx_continuous:
    exchange: FX
    tz: America/New_York
    description: "continuous from Sun 17:00 to Fri 17:00"
  crypto_24_7:
    exchange: COINBASE
    tz: UTC
    description: "around the clock, no weekends"

# tick_size is the exchange price step, needed by the winsorization (the eps_MAD
# floor includes the return on half a tick). It is stated explicitly rather than
# measured from the data: the source serves ETF prices with a floating tail -
# 769.53992 where the exchange shows 769.54 - so a measured precision of 1e-7
# describes the vendor's storage format, not the trading step. For currency pairs
# the source precision and the step coincide: five decimals, the yen included
# (verified on real data). For crypto the step is the pair's own quote_increment
# as Coinbase publishes it, which is not 0.01 for every pair - ADA and DOGE quote
# to five decimals. The audit cross-checks the two and complains if the step is
# finer than the precision.
#
# fetch_interval is the interval at which the instrument is REQUESTED from the
# source; it is not the system's working interval. ETF bars run on the :30
# (09:30, 10:30, ...), so they are pulled as half-hourly and folded into hourly
# bars on the round UTC hour - otherwise the cross-section would measure synchrony
# on series offset from one another by half an hour. This costs no credits: the
# plan counts requests, not rows.
#
# WHAT THIS COSTS. Twelve Data's free tier is 800 credits a day and one credit per
# symbol per request, batched or not. The 45 US-session instruments are asked for
# only during their own session and for three hours after it - see
# tremor.backfill.nothing_can_have_appeared - which is about ten requests a day
# each; the eight currency pairs trade around the clock and cost 24 each. That is
# roughly 640 of the 800, and the nine crypto pairs come from Coinbase, which is
# free. Deepening a newly added instrument to 2002 costs about 30 more, once,
# because a 30-minute chunk covers 300 days.
