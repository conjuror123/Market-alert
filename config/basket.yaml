# Tremor basket configuration.
#
# WHAT A BLOCK IS FOR. Every instrument here is modelled against the median of
# its own block, and against nothing else:
#
#     r = alpha + beta_block * B + e
#
# So a block is not a filing category. It is a claim that its members respond to
# the same thing with the same sign, because a median only stands for a common
# move when they do. That claim is what the composition below is chosen to make
# true, and it is why the blocks are narrower than they used to be.
#
# WHAT USED TO BE HERE AND IS NOT. A second regressor, the weighted median of the
# whole basket, meant as the "everything de-risks at once" factor. Such a factor
# is real - it is the first principal component of a multi-asset panel, and it is
# what 2008 and March 2020 look like - but a median cannot carry it, because that
# factor has SIGNS: equities down, Treasuries up, gold up. A median assumes its
# members all move the same way, so on exactly the days the common factor is
# strongest, stocks and bonds cancelled and the factor read near nothing.
#
# It could not be repaired by orienting the blocks the way the FX block is
# oriented, either. The equity-rates correlation is not a constant to hard-code:
# measured on the block medians it runs -0.66 in 2002 and -0.42 in 2008, and then
# FLIPS after the 2022 inflation shock to +0.24, +0.28, +0.43. A fixed sign would
# be right for twenty years and wrong for the last four; a rolling one is a
# principal component with extra steps.
#
# Dropping it was measured, not assumed. Adding the basket component back into
# every residual - which is what a block-only fit leaves, since least squares
# makes the fitted parts orthogonal to the residual - moved the hours where three
# or more instruments exceed four sigma at once from 610 to 645 in twenty-one
# years, and the mean absolute correlation between standardised residuals from
# 0.146 to 0.161. The rarity ladder is fitted to each instrument's own residual
# tail, so a uniform rise in residual sigma rescales away entirely and the alert
# rate is unchanged; only the clustering moves, and the same-day collapse folds
# most of that into one message anyway.
#
# WHY THE BLOCKS LOOK LIKE THIS. Commercial multi-asset risk models do not use
# one global factor either: they build a factor block per asset class and model
# the blocks jointly, on the stated assumption that all the risk factors inside a
# block share their time-series behaviour. Within equity the standard
# substructure is the eleven GICS sectors; within commodities it is the GSCI
# sectors - energy, precious metals, industrial metals, agriculture. That is what
# is below.
#
# The one block that used to break its own rule was rates, which held HYG. High
# yield is credit risk, and credit risk trades like equity, not like duration:
# HYG's block factor explained 8% of its spread against SPY's 63%, and the basket
# factor was the only thing carrying it - which is exactly why it looked like the
# best argument for keeping the basket. It now sits in a credit block beside JNK,
# LQD, EMB, BKLN and PFF, where its peers are actually its peers.
#
# Weights are DELIBERATELY absent. They are derived from the composition under
# the equality rule
#     weight_i = 1 / (N_blocks * N_assets_block)
# and a stored weight could be hand-edited out of line with the rule, so the only
# way never to diverge is not to store it. They no longer enter the model at all
# - a block median is unweighted, since within a block the rule makes every
# weight equal - and survive only for the cross-sectional diagnostics (breadth,
# CSV, PC1) that feed the cluster channel.
#
# There are two live US-session providers besides Coinbase. Yahoo is the
# consolidated-tape feed for the fifteen thin ETFs Tiingo's IEX slice cannot
# price (see docs/tiingo-findings.md). Twelve Data remains the archive.

# Anchor exchange of the basket's reference calendar: Sun 17:00 .. Fri 17:00
# local time. The bounds are stored in this timezone and converted to UTC on the
# fly - they must not be stored as UTC.
anchor_exchange_tz: America/New_York

# Start of history. Matches the train period - this is the ANALYSIS floor, and
# moving it moves the evaluation window.
history_since: "2015-01-01"

# The ACQUISITION floor, which is a different question: take whatever the
# sources will still give, whether or not the analysis reaches it yet. Free
# archives freeze, so bars not taken now may not be takeable later, and storing
# history the analysis does not use costs nothing but disk. Each source stops at
# its own limit on its own (see tremor.backfill and price_monitor.dukascopy), so
# a floor deeper than anything
# available is simply the instruction "as deep as you can".
#
# WHICH SOURCE REACHES HOW FAR BACK, because it is not one answer and getting it
# wrong wastes a day of credits:
#   Twelve Data   intraday stops at 2020-02 for every ETF at once, whatever the
#                 ticker's real age. This is the ordinary --extend-history pass.
#   HF Data       2002 to 2020-02 for US equity, from the consolidated tape.
#                 This is the --deepen-etfs pass, it spends no Twelve Data
#                 credits, and it is the ONLY way an ETF here reaches 2002. The
#                 library switches to IEX-only data in March 2022 and the module
#                 refuses those bars outright - see price_monitor.hfdata.
#   Dukascopy     2003 for the currency pairs (--deepen-dukascopy), no key.
#   Coinbase      each pair's own listing date, no key and no credits.
# So a newly added ETF needs BOTH Twelve Data passes and the HF Data one before
# its history is comparable with SPY's.
fetch_since: "2002-01-01"

# ---------------------------------------------------------------------------
# THE TWO KNOBS. Everything else in this file describes the market; these two
# describe how much of it you want to hear about, and they are here rather than
# in the code so that turning them is an edit and not a release.
#
# They answer DIFFERENT questions and neither substitutes for the other.
#
# sensitivity - HOW BIG must a move be before it is worth a line. It scales every
# rung of every block at once: 1.0 leaves them where tremor/severity.py sets
# them, 2.0 doubles every threshold and cuts the messages hard, 0.5 the other
# way. Scaling them TOGETHER is the point - moving one rung alone would silently
# re-rank a move from major to high, which is a different thing from asking for
# fewer messages.
#
# It does NOT equalise instruments, and must not: the rungs are in units of each
# instrument's own sigma, and how often a market crosses them is a fact about
# that market. Measured, the basket spans about 7x between its quietest and
# loudest instrument, which is the dispersion the ladder was rebuilt to get.
#
# Changing it moves config_version, which retires derived data and costs one
# cold run. That is correct: the events would otherwise be a mix of two rules.
sensitivity: 1.0

# block_sigma - the rungs themselves, per block, in multiples of the
# instrument's own long-run sigma. OPTIONAL: the shipped table lives in
# tremor/severity.py (BLOCK_SIGMA) because it is the shape of the ladder rather
# than a deployment setting, and only the blocks named here override it.
#
# Four numbers, increasing: noticeable, high, major, extreme.
#
#   block_sigma:
#     crypto: [7.2, 10.8, 15.9, 23.1]
#
# WHY PER BLOCK. A single threshold across the basket claims that 5 sigma means
# the same thing in Solana and in utilities, and it does not: flat, crypto ran at
# 36-43 messages a year and XLU, XLRE and XLB at about one - a 47x spread.
# Instruments in a block share a return shape, so setting the threshold per block
# removes the systematic part of that difference and leaves the idiosyncratic
# part standing. The equity block still spans 6.5x internally.
#
# WHY NOT PER BLOCK SIZE. Measured, and it is the opposite of the intuition: the
# equity block has the MOST members, sixteen, and the second-quietest assets - 70
# messages a year between them against crypto's 281 from nine. Dividing by
# headcount would quiet the block that is already quiet.

# min_move_sigma - HOW BIG must a move be, in its own terms, to be worth a line
# at all, whatever the ladder says about rarity. This is the floor the system
# went without for too long: the abnormal channel asks whether a move was
# unexplained, not whether it was large, so an instrument that ticked +0.03%
# while its block went the other way could be reported as a once-a-month event.
# Measured on the record, every event below one times its own usual hour was
# abnormal-only - 240 of 9,069, about eleven a year - and they are the ones
# that read as noise.
#
# In units of the instrument's own sigma_LT, so the number means the same thing
# to SHY and to SOL. 0 disables it.
#
# THIS IS THE DEFAULT, AND ANY INSTRUMENT MAY OVERRIDE IT on its own entry in
# `assets` or `outside` below:
#
#   - ticker: PFF
#     ...
#     min_move_sigma: 2.5
#
# That override is the ONE lever that makes instruments speak at different
# rates, and it exists because nothing else can. A rung is the biggest move in
# its own lookback, so every instrument clears one about once per lookback
# whatever its market does - that is what makes "the biggest since March 2020"
# mean one thing across a digest, and it is also why the rungs cannot be what
# separates a loan ETF from Solana. With one shared floor the whole basket sat
# between 9.3 and 20.4 events a year, a 2.2x spread across instruments that
# differ by far more.
#
# Do not guess these. `python -m tremor.feedback --boring 'PFF 2026-09-09 13:00'`
# records that a message was not worth reading, and the suggestion it prints
# names the floor that instrument would need and what it costs that instrument
# alone. Raising the shared number instead silences every quiet instrument at
# once - point at PFF and lose SHY.
#
# Changing any of them moves config_version, which retires derived data and
# costs one cold run. That is correct: the events would otherwise be a mix of
# two rules.
min_move_sigma: 1.0

# Session templates are filled in during phase 1 (holiday and half-session
# calendars); here only the names the assets refer to.
session_templates:
  us_equity:
    exchange: NYSE
    tz: America/New_York
    description: "09:30-16:00 on business days, with NYSE holidays and half sessions"
  fx_continuous:
    exchange: FX
    tz: America/New_York
    description: "continuous from Sun 17:00 to Fri 17:00"
  crypto_24_7:
    exchange: COINBASE
    tz: UTC
    description: "around the clock, no weekends"

# tick_size is the exchange price step, needed by the winsorization (the eps_MAD
# floor includes the return on half a tick). It is stated explicitly rather than
# measured from the data: the source serves ETF prices with a floating tail -
# 769.53992 where the exchange shows 769.54 - so a measured precision of 1e-7
# describes the vendor's storage format, not the trading step. For currency pairs
# the source precision and the step coincide: five decimals, the yen included
# (verified on real data). For crypto the step is the pair's own quote_increment
# as Coinbase publishes it, which is not 0.01 for every pair - ADA and DOGE quote
# to five decimals. The audit cross-checks the two and complains if the step is
# finer than the precision.
#
# fetch_interval is the interval at which the instrument is REQUESTED from the
# source; it is not the system's working interval. ETF bars run on the :30
# (09:30, 10:30, ...), so they are pulled as half-hourly and folded into hourly
# bars on the round UTC hour - otherwise the cross-section would measure synchrony
# on series offset from one another by half an hour. This costs no credits: the
# plan counts requests, not rows.
#
# WHAT THIS COSTS, HOURLY. Live bars are not Twelve Data. Tiingo serves 29
# US-session funds and the 8 FX pairs (50 requests/hour, 1000/day); Yahoo
# serves the 15 thin ETFs (no published quota); Coinbase serves the 9 crypto
# pairs (free). US-session names skip when the NYSE calendar says no bar can
# have appeared; FX skips when the Sun 17:00-Fri 17:00 New York week is shut
# - see tremor.backfill.nothing_can_have_appeared. Twelve Data's 800/day and
# 8-second pause apply to archive work (--extend-history, --fill-gaps), not
# the hourly run. Deepening a newly added ETF to 2002 is HF Data, once.
#
# SOURCE IS THE STORE; PROVIDER IS THE SERVER. `source` names the identity: both
# the asset_id and the file on disk are built from it, so every bar ever stored,
# every row of feedback.csv and every exported event is keyed by it. It is not
# edited when the fetch moves. `provider` says who is actually asked, and it can
# change freely - the bars land in the same place either way.
#
# WHY THEY DIFFER NOW. Twelve Data's free tier allows 8 requests a minute, which
# the backfill honours with an 8-second pause between instruments. For 52 symbols
# that pause was the entire run: 416 seconds of deliberate waiting. The other two
# providers have no enforced pace, so the run is now about 12 seconds.
#
# WHICH PROVIDER, AND ON WHAT EVIDENCE. Each instrument was fetched from both
# candidates and compared against the bars already stored, hour by hour, in basis
# points - the full table is in docs/tiingo-findings.md.
#
#   tiingo  the eight currency pairs, and the ETFs whose IEX-only price matches
#           the consolidated tape. Tiingo is the best FX source measured here
#           (0.43-1.57 bps against Yahoo's 0.43-3.26, whose FX quotes are
#           indicative rather than traded).
#   yahoo   the fifteen ETFs where IEX is NOT the same price. These are thin
#           commodity and credit funds where one exchange's slice of the tape
#           diverges: SOYB by 7.2 bps, UGA by 7.97 with a worst hour of 76.8,
#           which is about two sigma and would be delivered as a move that never
#           happened. Yahoo matches the store at 0.00 bps median on all of them.
#
# Twelve Data still holds the archive and still serves --fill-gaps and
# --extend-history: Yahoo caps intraday lookback at 55 days and Tiingo caps a
# response at 10000 rows, so neither can deepen history however fast they answer.
assets:
