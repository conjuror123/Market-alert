# Список отслеживаемых активов. У каждого — свой источник данных (публичные API,
# ключи не нужны):
#   coinbase — крипто-пары Coinbase Exchange, формат BASE-QUOTE (например BTC-USD).
#   yahoo    — фьючерсы/индексы/валюта через Yahoo Finance, тикер как на finance.yahoo.com.
#
# У любого актива можно переопределить любой из общих параметров ниже по файлу —
# просто добавьте тот же ключ прямо в запись актива (interval, lookback, mad_window,
# ewma_lambda, price_zscore_threshold, volume_zscore_threshold,
# volume_min_price_move_z, cooldown_minutes, min_history). Значение по умолчанию
# берётся из глобальной настройки внизу файла, если для актива ничего не задано.
# При ~сотне активов максимум это дешёво и оправданно: разным классам активов
# реально нужна разная чувствительность (см. находки бэктеста ниже), а не один
# компромиссный порог на всех.
#
# ВАЖНО про валютные пары (EURUSD=X, CNY=X и т.п.): у спот-форекса нет единого
# биржевого объёма, Yahoo всегда отдаёт по ним volume=0 — для таких активов работает
# только ценовой сигнал (EWMA + робастный z-score), сигнал по объёму для них никогда
# не сработает, и это ожидаемо.
# ВАЖНО про фьючерсы (GC=F, CL=F, ES=F, ZB=F): Yahoo отдаёт "непрерывный" контракт
# ближайшего месяца, который сам переезжает на следующий контракт при экспирации —
# в момент такого ролловера возможен ценовой гэп, не связанный с реальным движением
# рынка, и он может изредка (несколько раз в год) вызвать ложный алерт.
assets:
  - symbol: BTC-USD
    source: coinbase
    label: "Bitcoin"
  - symbol: ETH-USD
    source: coinbase
    label: "Ethereum"
  - symbol: SOL-USD
    source: coinbase
    label: "Solana"
  - symbol: "GC=F"
    source: yahoo
    label: "Золото (Gold futures)"
  - symbol: "CL=F"
    source: yahoo
    label: "Нефть WTI (Crude Oil futures)"
  - symbol: "ES=F"
    source: yahoo
    label: "S&P 500 (E-mini futures)"
    # Бэктест (см. README) показал: у биржевых фьючерсов объём предсказуемо
    # подскакивает на открытии сессии почти каждый торговый день, и общий
    # volume_min_price_move_z=1.5 этого не отсеивает — 864 из 897 алертов за год
    # были по объёму, ~22/неделю. Требуем более заметное движение цены рядом со
    # всплеском объёма и сам всплеск объёма позаметнее.
    volume_min_price_move_z: 3.0
    volume_zscore_threshold: 5.0
  - symbol: "ZB=F"
    source: yahoo
    label: "US 30Y Treasury Bond futures"
  - symbol: "EURUSD=X"
    source: yahoo
    label: "EUR/USD"
  - symbol: "CNY=X"
    source: yahoo
    label: "USD/CNY"
    # Бэктест нашёл: Yahoo часто отдаёт для этой пары "залипшую" часовую свечу без
    # обновления цены (18% часов), из-за чего база нормального движения (MAD)
    # искусственно сжимается и рядовые шаги цены выглядят как экстремальные выбросы
    # (пример: движение на 0.37% дало robust z-score −173.75). Это компенсирующая
    # мера — приподнимаем порог, а не настоящий фикс (тот требует не учитывать в MAD
    # свечи без изменения цены, это отдельная задача в analysis.py).
    price_zscore_threshold: 4.0

# Таймфрейм свечей — общий для всех активов (обоих источников) и должен
# соответствовать частоте запуска workflow (по умолчанию раз в час, см.
# .github/workflows/price-monitor.yml). Поддерживаются: 1m, 5m, 15m, 1h, 1d
# (значение "6h" у Coinbase есть нативно, а у Yahoo нет — не используйте его, если
# среди активов есть источник yahoo). 1h выбран вместо 15m, чтобы уместить в лимит
# Coinbase (максимум 300 свечей за запрос) намного больше истории: 300 часовых
# свечей ≈ 12.5 дней вместо ≈3.1 дня на 15-минутках — статистическая база для
# z-score получается заметно надёжнее.
interval: "1h"

# Сколько последних свечей запрашивать за один раз. Ограничено самым строгим
# источником — Coinbase отдаёт максимум 300 свечей за запрос (300 * 1ч ≈ 12.5 дня
# истории); Yahoo отдаёт заметно больше, но урезается до того же значения.
lookback: 300

# Скользящее окно для робастной (медиана/MAD) базовой линии, в свечах (288ч ≈ 12 дней).
mad_window: 288

# Коэффициент затухания EWMA-волатильности (RiskMetrics по умолчанию — 0.94).
ewma_lambda: 0.94

# Порог z-score для аномального движения цены (оба сигнала — EWMA и робастный — должны его превысить).
price_zscore_threshold: 3.0

# Порог z-score для аномального объёма.
volume_zscore_threshold: 4.0

# Минимальный z-score движения цены, чтобы всплеск объёма тоже считался тревогой.
volume_min_price_move_z: 1.5

# Не слать повторные алерты по одному активу чаще, чем раз в N минут.
cooldown_minutes: 120

# Минимальное число свечей истории, необходимое перед тем как начать анализ актива
# (60ч ≈ 2.5 дня разгона, пока не накопится статистика).
min_history: 60

# Через сколько подряд неудачных запусков (получение данных или отправка в Telegram
# упали хотя бы по одному активу) слать отдельное сообщение "мониторинг не работает".
# При 1 запуске в час 3 = ждём 3 часа, прежде чем поднимать тревогу.
health_alert_after_failures: 3

# Пока мониторинг не работает — слать напоминание каждые N неудачных запусков
# (24 ≈ раз в сутки при часовом опросе), чтобы не забыть о долгой проблеме, но и не
# спамить каждый час. 0 — напомнить один раз и больше не повторять.
health_reminder_every_failures: 24
