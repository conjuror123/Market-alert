# What the hourly run needs, and nothing else.
#
# This file used to configure a detector: sixteen assets, and for each of them a
# dial on every threshold it had. That detector is gone - Tremor replaced it, and
# Tremor keeps its instruments in config/basket.yaml in a form that needs no
# hand-typed threshold at all. See price_monitor/__main__.py.
#
# Secrets are NOT here and must never be. The repository is public; the Telegram
# token and chat ids and every provider key are read from the environment, which
# in the workflow means GitHub Actions secrets.

# --- Muting ------------------------------------------------------------------
#
# true - the hourly run proceeds as usual: bars are fetched, the pipeline runs,
# events are routed and written, the Sunday calendar digest goes out and so does
# the bot's own health alert. The only thing that does not go out is Tremor's own
# pushes and its Monday/Saturday digest.
#
# It lives here rather than on the external scheduler's side, deliberately: "we
# are deliberately silent" is a state of the project and must be visible where
# the code is. A cron job disabled on someone else's website is indistinguishable
# from a breakage a month later.
tremor_alerts_muted: false

# --- Health ------------------------------------------------------------------
#
# How many consecutive failed runs before the bot says so, and how often it
# repeats itself afterwards. It reports runs that FAILED, which is all a check
# living inside the run can report: a run that never happened increments
# nothing. Runs that never happen are cron-job.org's to notice, since the
# trigger is its call to make - see docs/operations.md.
health_alert_after_failures: 3
health_reminder_every_failures: 24
