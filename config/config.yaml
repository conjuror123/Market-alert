# Список торговых пар Coinbase Exchange для мониторинга (публичный API, ключ не нужен).
# Формат product id: BASE-QUOTE, например BTC-USD.
symbols:
  - BTC-USD
  - ETH-USD
  - SOL-USD

# Таймфрейм свечей для статистики — должен соответствовать частоте запуска workflow
# (по умолчанию раз в час, см. .github/workflows/price-monitor.yml).
# Поддерживаются гранулярности Coinbase: 1m, 5m, 15m, 1h, 6h, 1d.
# 1h выбран вместо 15m, чтобы уместить в лимит Coinbase (максимум 300 свечей за
# запрос) намного больше истории: 300 часовых свечей ≈ 12.5 дней вместо ≈3.1 дня
# на 15-минутках — статистическая база для z-score получается заметно надёжнее.
interval: "1h"

# Сколько последних свечей запрашивать за один раз. Coinbase отдаёт максимум 300
# свечей за один запрос (300 * 1ч ≈ 12.5 дня истории).
lookback: 300

# Скользящее окно для робастной (медиана/MAD) базовой линии, в свечах (288ч ≈ 12 дней).
mad_window: 288

# Коэффициент затухания EWMA-волатильности (RiskMetrics по умолчанию — 0.94).
ewma_lambda: 0.94

# Порог z-score для аномального движения цены (оба сигнала — EWMA и робастный — должны его превысить).
price_zscore_threshold: 3.0

# Порог z-score для аномального объёма.
volume_zscore_threshold: 4.0

# Минимальный z-score движения цены, чтобы всплеск объёма тоже считался тревогой.
volume_min_price_move_z: 1.5

# Не слать повторные алерты по одному активу чаще, чем раз в N минут.
cooldown_minutes: 120

# Минимальное число свечей истории, необходимое перед тем как начать анализ актива
# (60ч ≈ 2.5 дня разгона, пока не накопится статистика).
min_history: 60
