# Список отслеживаемых активов. У каждого — свой источник данных:
#   coinbase   — крипто-пары Coinbase Exchange, формат BASE-QUOTE (например BTC-USD),
#                ключ не нужен.
#   yahoo      — фьючерсы/индексы через Yahoo Finance, тикер как на finance.yahoo.com,
#                ключ не нужен (неофициальный эндпоинт, см. README).
#   twelvedata — валютные пары через Twelve Data, формат BASE/QUOTE (например EUR/USD),
#                нужен бесплатный ключ (секрет TWELVEDATA_API_KEY, см. README). Отдельный
#                провайдер именно для форекса — если Yahoo ляжет, валютные пары всё равно
#                продолжат работать, и наоборот.
#
# ВАЖНО про Twelve Data: бесплатный тариф — 8 запросов в минуту и 800 в сутки, по одному
# запросу на актив. Именно поэтому валютных пар ровно 8 — это использует весь минутный
# лимит за один прогон, но не больше: добавлять девятую пару на этом тарифе нельзя, не
# убрав одну из текущих (или не перейдя на платный план).
#
# У любого актива можно переопределить любой из общих параметров ниже по файлу —
# просто добавьте тот же ключ прямо в запись актива (interval, lookback, mad_window,
# ewma_lambda, price_zscore_threshold, price_zscore_override,
# volume_zscore_threshold, volume_zscore_override, volume_min_price_move_z,
# cooldown_minutes, escalation_factor, min_history, а также daily_mad_window,
# daily_ewma_lambda, daily_price_zscore_threshold, daily_price_zscore_override,
# daily_min_history, daily_cooldown_minutes, daily_escalation_factor — те же ручки
# для дневного сигнала, см. ниже). Значение по умолчанию берётся
# из глобальной настройки внизу файла, если для актива ничего не задано. При ~сотне
# активов максимум это дёшево и оправданно: разным классам активов реально нужна
# разная чувствительность (см. находки бэктеста в README), а не один компромиссный
# порог на всех.
#
# ВАЖНО про валютные пары (EUR/USD, USD/CNY и т.п.): у спот-форекса нет единого
# биржевого объёма ни у одного провайдера — Twelve Data всегда отдаёт по ним volume=0,
# для таких активов работает только ценовой сигнал (EWMA + робастный z-score), сигнал
# по объёму для них никогда не сработает, и это ожидаемо, а не недостаток источника.
# ВАЖНО про фьючерсы (GC=F, CL=F, ES=F, ZB=F): Yahoo отдаёт "непрерывный" контракт
# ближайшего месяца, который сам переезжает на следующий контракт при экспирации —
# в момент такого ролловера возможен ценовой гэп, не связанный с реальным движением
# рынка, и он может изредка (несколько раз в год) вызвать ложный алерт.
#
# news_query — необязательное поле, поисковый запрос для Google News, когда вы
# вручную запускаете "Explain Alerts" (объяснение алерта через LLM, см. README).
# Нужен, только если label не годится как поисковый запрос (смешивает русский и
# английский, содержит скобки и т.п.) — если не задать, используется label как есть.
#
# ВАЖНО: чем короче запрос, тем больше результатов отдаёт Google News — проверено
# вживую на всех валютных парах: "EUR USD euro dollar exchange rate" (6 слов) дало
# 3 результата за два тестовых дня, а просто "EUR/USD" — 17; "US dollar index DXY"
# дало 0, а "dollar index" — 18. Похоже, чем больше слов, тем ближе поиск к "все
# слова обязаны встретиться", и длинные, "точные" формулировки почти всегда хуже
# короткого естественного запроса. Держите news_query коротким (1-3 слова).
assets:
  - symbol: BTC-USD
    source: coinbase
    label: "Bitcoin"
    daily_price_zscore_threshold: 2.6
    daily_price_zscore_override: 7.8
  - symbol: ETH-USD
    source: coinbase
    label: "Ethereum"
    daily_price_zscore_threshold: 2.5
    daily_price_zscore_override: 7.5
  - symbol: SOL-USD
    source: coinbase
    label: "Solana"
    daily_price_zscore_threshold: 2.2
    daily_price_zscore_override: 6.6
  - symbol: "GC=F"
    source: yahoo
    label: "Золото (Gold futures)"
    news_query: "gold price"
    daily_price_zscore_threshold: 2.6
    daily_price_zscore_override: 7.8
  - symbol: "CL=F"
    source: yahoo
    label: "Нефть WTI (Crude Oil futures)"
    news_query: "WTI crude oil price"
    daily_price_zscore_threshold: 2.3
    daily_price_zscore_override: 6.9
  - symbol: "ES=F"
    source: yahoo
    label: "S&P 500 (E-mini futures)"
    news_query: "S&P 500"
    # Бэктест нашёл: объём E-mini фьючерса имеет резкую внутридневную сезонность
    # (тихая ночная сессия против насыщенной сессии NYSE), и робастный z-score
    # относительно скользящего окна из обеих смешанных вместе даёт абсурдные
    # значения — z до 105 наблюдался в реальных данных, это не выброс, а
    # структурная поломка модели "медиана/MAD" для этого конкретного распределения.
    # Порогом это не лечится ни при каком разумном значении, поэтому объёмный канал
    # для этого актива отключён — работает только ценовой сигнал.
    volume_zscore_threshold: 200.0
    volume_zscore_override: 200.0
    daily_price_zscore_threshold: 2.9
    daily_price_zscore_override: 8.7
  - symbol: "ZB=F"
    source: yahoo
    label: "US 30Y Treasury Bond futures"
    news_query: "30 year Treasury bond yield"
    daily_price_zscore_threshold: 2.6
    daily_price_zscore_override: 7.8
  - symbol: "EUR/USD"
    source: twelvedata
    label: "EUR/USD"
    news_query: "EUR/USD"
    daily_price_zscore_threshold: 2.6
    daily_price_zscore_override: 7.8
  - symbol: "GBP/USD"
    source: twelvedata
    label: "GBP/USD"
    news_query: "GBP/USD"
    daily_price_zscore_threshold: 2.5
    daily_price_zscore_override: 7.5
  - symbol: "USD/JPY"
    source: twelvedata
    label: "USD/JPY"
    news_query: "USD/JPY"
    daily_price_zscore_threshold: 2.6
    daily_price_zscore_override: 7.8
  - symbol: "USD/CHF"
    source: twelvedata
    label: "USD/CHF"
    news_query: "USD/CHF"
    daily_price_zscore_threshold: 2.9
    daily_price_zscore_override: 8.7
  - symbol: "USD/CAD"
    source: twelvedata
    label: "USD/CAD"
    news_query: "USD/CAD"
    daily_price_zscore_threshold: 2.5
    daily_price_zscore_override: 7.5
  - symbol: "AUD/USD"
    source: twelvedata
    label: "AUD/USD"
    news_query: "AUD/USD"
    daily_price_zscore_threshold: 2.4
    daily_price_zscore_override: 7.2
  - symbol: "NZD/USD"
    source: twelvedata
    label: "NZD/USD"
    news_query: "NZD/USD"
    daily_price_zscore_threshold: 2.6
    daily_price_zscore_override: 7.8
  - symbol: "USD/CNY"
    source: twelvedata
    label: "USD/CNY"
    news_query: "yuan"
    daily_price_zscore_threshold: 2.2
    daily_price_zscore_override: 6.6
  - symbol: "DX-Y.NYB"
    source: yahoo
    label: "Индекс доллара (DXY)"
    news_query: "dollar index"
    daily_price_zscore_threshold: 2.5
    daily_price_zscore_override: 7.5

# Таймфрейм свечей — общий для всех активов (обоих источников) и должен
# соответствовать частоте запуска workflow (по умолчанию раз в час, см.
# .github/workflows/price-monitor.yml). Поддерживаются: 1m, 5m, 15m, 1h, 1d
# (значение "6h" у Coinbase есть нативно, а у Yahoo нет — не используйте его, если
# среди активов есть источник yahoo). 1h выбран вместо 15m, чтобы уместить в лимит
# Coinbase (максимум 300 свечей за запрос) намного больше истории: 300 часовых
# свечей ≈ 12.5 дней вместо ≈3.1 дня на 15-минутках — статистическая база для
# z-score получается заметно надёжнее.
interval: "1h"

# --- Заглушение алертов -----------------------------------------------------
#
# true — часовой прогон идёт как обычно: котировки качаются, история
# пополняется, решения пишутся в data/decision_log/, дайджест календаря по
# субботам уходит, уведомление о поломке самого бота уходит. Не уходят только
# сообщения по активам — те самые сигналы, которые сейчас заменяются на MEALS.
#
# Заглушка не тратит кулдаун: состояние остаётся таким, будто сигнала не было,
# и после снятия первое же настоящее движение пройдёт, а не упрётся в паузу,
# накопленную за время молчания.
#
# Флаг лежит здесь, а не выключается на стороне внешнего планировщика,
# намеренно: "мы намеренно молчим" — это состояние проекта, и оно должно быть
# видно в репозитории. Выключенный на чужом сайте cron через месяц неотличим от
# поломки.
alerts_muted: true

# Сколько последних свечей запрашивать за один раз. Ограничено самым строгим
# источником — Coinbase отдаёт максимум 300 свечей за запрос (300 * 1ч ≈ 12.5 дня
# истории); Yahoo отдаёт заметно больше, но урезается до того же значения.
lookback: 300

# Скользящее окно для робастной (медиана/MAD) базовой линии, в свечах (288ч ≈ 12 дней).
mad_window: 288

# Коэффициент затухания EWMA-волатильности (RiskMetrics по умолчанию — 0.94).
ewma_lambda: 0.94

# Порог z-score для аномального движения цены (оба сигнала — EWMA и робастный — должны его превысить).
#
# Эти четыре порога (price/volume × threshold/override) намеренно подобраны бэктестом
# (см. README) под конкретную цель по частоте — 0-1 алерт в неделю в спокойное время,
# 2-3 в самые волатильные периоды, — а не под то, чтобы поймать максимум крупных
# исторических движений любой ценой. Цель считается не суммарно по всем активам сразу,
# а отдельно по группам (валютная группа — форекс + DXY — и всё остальное): при
# добавлении DXY и восьми валютных пар это разделение стало нужно, иначе одна общая
# цифра на 16 разных активов перестаёт быть осмысленной. Раньше (price_zscore_threshold:
# 3.0, price_zscore_override: 8.0) система была настроена на противоположную цель —
# ничего крупного не пропустить — и в реальности выдавала около 22 алертов в неделю
# на куда меньшем наборе активов, что оказалось чрезмерно. При текущих значениях
# бэктест на реальной годовой истории даёт ~1.8/нед на группу "крипта+сырьё" и ~1.9/нед
# на валютную группу (recall на 80 крупнейших исторических движениях — 42/80: часть
# пропусков — намеренная работа cooldown/escalation, схлопывающая несколько соседних
# всплесков одного и того же эпизода в одно уведомление; у части валютных пар recall
# ниже даже при более низком пороге — не калибровочная проблема, см. README).
price_zscore_threshold: 7.0

# Экстремальное значение ЛЮБОГО ОДНОГО из двух сигналов (EWMA или робастный),
# достаточное само по себе, без подтверждения вторым, и — важно — обходящее даже
# cooldown ниже (см. escalation_factor): по-настоящему экстремальное событие всегда
# долетает, а не ждёт своей очереди. Подтверждение остальным механизмам нужно, чтобы
# отсекать пограничные случаи — не чтобы прятать события, которые экстремальны по
# любому измерению.
price_zscore_override: 22.0

# Порог z-score для аномального объёма — теперь того же порядка, что и ценовой,
# см. комментарий выше про целевую частоту. На практике при такой планке объёмный
# канал в основном работает как ещё один способ поймать по-настоящему крупное
# событие, а не как независимый частый источник алертов на умеренные всплески
# объёма — так и было задумано при пересчёте под новую, гораздо более редкую цель.
volume_zscore_threshold: 22.0

# Экстремальный всплеск объёма сам по себе, без подтверждения движением цены и в
# обход cooldown — как price_zscore_override, но для объёма.
volume_zscore_override: 22.0

# Минимальный z-score движения цены, чтобы всплеск объёма тоже считался тревогой.
volume_min_price_move_z: 1.5

# Не слать повторный алерт по активу раньше, чем через N минут после предыдущего —
# если только новое событие не экстремально само по себе (price/volume_zscore_override
# выше, тогда cooldown обходится полностью) или не эскалация (см. escalation_factor).
# 20160 = 14 дней. Раз между price_zscore_threshold и price_zscore_override теперь
# большой разрыв (7 и 22), у cooldown стало больше работы: он гасит повторные
# «подтверждённые, но не экстремальные» события по одному и тому же активу в течение
# этого окна, схлопывая один турбулентный эпизод в одно уведомление вместо нескольких.
cooldown_minutes: 20160

# Во время cooldown повторный алерт (недостаточно экстремальный для override выше)
# всё равно уходит, если его severity (max(|EWMA z|, |робастный z|, volume z))
# минимум во столько раз больше severity предыдущего алерта — так рутинный шум на
# том же уровне схлопывается в одно уведомление, а по-настоящему усиливающаяся
# ситуация — нет.
escalation_factor: 1.5

# Минимальное число свечей истории, необходимое перед тем как начать анализ актива
# (60ч ≈ 2.5 дня разгона, пока не накопится статистика).
min_history: 60

# Дневной сигнал (см. README, "Дневной сигнал") — второй, независимый от часового,
# детектор поверх дневных свечей, которые строятся сами (из уже накопленной локальной
# истории в data/candle_history/, см. price_monitor/candle_store.py), без отдельного
# запроса к источнику. Ловит то, что часовой сигнал структурно не видит: медленный
# многочасовой "наплыв" в одну сторону, где ни один час сам по себе не аномален, а
# суммарное движение за сутки — уже да. Применяется ко всем активам одинаково, не
# только к валютам (дыра структурная, не зависит от класса актива).
#
# Калибруется иначе, чем часовой: не под целевую частоту, а под recall — порог для
# каждого актива подбирается отдельно (`python -m price_monitor.backtest
# --local-history --calibrate-daily-recall`) так, чтобы поймать примерно половину
# самых крупных исторических движений этого актива, где "самых крупных" — топ-N,
# N ≈ число месяцев доступной истории (не фиксированная пятёрка). Реальный порог —
# per-asset override в записи каждого актива выше по файлу; значения ниже — только
# запасной вариант на случай нового актива без своей калибровки.
daily_price_zscore_threshold: 4.0
daily_price_zscore_override: 8.0

# Затухание EWMA и окно робастной базовой линии для дневного сигнала — та же логика,
# что ewma_lambda/mad_window выше, только в днях, а не в часах. 300 дней — то самое
# окно, на которое опирается гипотеза "у валютных пар выше инерция": чтобы её
# оценить, нужна дневная, а не часовая, статистика.
daily_ewma_lambda: 0.94
daily_mad_window: 300

# Минимум дней истории, прежде чем дневной сигнал начнёт работать по активу.
daily_min_history: 30

# 2880 = 2 дня — короче часового cooldown (14 дней) намеренно: escalation_factor
# и так пропускает по-настоящему усиливающееся движение сквозь cooldown, так что
# длинная пауза здесь не нужна — хватает и пары дней, чтобы не дублировать
# уведомление про продолжение того же по силе движения. Строго per-asset — общего
# cooldown на несколько активов сразу нет и не будет: каждый актив, пересекший свой
# порог, всегда шлёт своё уведомление независимо от остальных (см. README) — это
# сознательный выбор в пользу простоты и надёжной доставки, а не пропущенная
# оптимизация.
daily_cooldown_minutes: 2880
daily_escalation_factor: 1.5

# Через сколько подряд неудачных запусков (получение данных или отправка в Telegram
# упали хотя бы по одному активу) слать отдельное сообщение "мониторинг не работает".
# При 1 запуске в час 3 = ждём 3 часа, прежде чем поднимать тревогу.
health_alert_after_failures: 3

# Пока мониторинг не работает — слать напоминание каждые N неудачных запусков
# (24 ≈ раз в сутки при часовом опросе), чтобы не забыть о долгой проблеме, но и не
# спамить каждый час. 0 — напомнить один раз и больше не повторять.
health_reminder_every_failures: 24

# LLM для отдельного, запускаемого вручную шага "Explain Alerts" (объяснение алерта
# по новостям, см. README). base_url должен принимать запросы в формате OpenAI
# /chat/completions — так устроены DeepSeek, OpenAI и большинство других
# провайдеров, так что смена провайдера — это только эти значения плюс то, какой
# секрет подставлен в LLM_API_KEY в .github/workflows/explain-alerts.yml. Сам ключ
# сюда не пишется — он берётся из секрета репозитория.
llm_base_url: "https://api.deepseek.com"

# У DeepSeek цена зависит от времени суток: в "пиковые" часы — 01:00–04:00 и
# 06:00–10:00 UTC по будням — цена полная, всё остальное время (вечера, ночи,
# выходные) — вдвое дешевле (https://api-docs.deepseek.com/quick_start/pricing/).
# Поэтому в пик используется модель попроще и подешевле, а в остальное время —
# более сильная: за счёт скидки она обходится примерно как обычная цена попроще.
# Логика выбора — price_monitor/llm.py, функция select_model. Если решите сменить
# провайдера на такого, у которого нет деления на пик/не пик, просто укажите здесь
# одну и ту же модель в обеих строчках — выбор по времени станет не важен.
llm_model_peak: "deepseek-v4-flash"
llm_model_offpeak: "deepseek-v4-pro"

# "Explain Alerts" ищет новости строго в окне [алерт+6ч, алерт+12ч] — это
# фиксированный отрезок времени относительно самого алерта, а не "от алерта до
# сейчас" (см. README). explain_min_age_hours не даёт запустить обработку раньше,
# чем это окно целиком наступит — иначе поиск захватил бы только его часть.
# Должно совпадать с NEWS_WINDOW_END_HOURS в price_monitor/explain.py.
explain_min_age_hours: 12.0
