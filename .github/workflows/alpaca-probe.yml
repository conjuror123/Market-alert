# Runs tools/alpaca_compare.py, which is the only place the Alpaca keys can be
# exercised: they are repository secrets, so a laptop or a sandbox cannot reach
# them. Read-only - it fetches and measures, and writes nothing.
#
# Manual only. The question it answers is a one-off - which Alpaca feed, if
# either, prices this basket the way the stored bars do - and the answer only
# changes when the plan or the provider does.
name: Alpaca Probe

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Comma-separated ETFs to compare (blank = all 44)'
        type: string
        default: ''
      feeds:
        description: 'Which feeds to measure: iex, sip, or both'
        type: string
        default: 'iex,sip'
      days:
        description: 'How many days back to compare'
        type: string
        default: '30'
      probe:
        description: 'Probe coverage, depth, freshness and FX'
        type: boolean
        default: true
      compare:
        description: 'Compare against the stored bars in basis points'
        type: boolean
        default: false
      finnhub:
        description: 'Probe Finnhub instead: access, freshness, limits, coverage'
        type: boolean
        default: false
      sifting:
        description: 'Probe SiftingIO instead: freshness, FX, agreement, coverage'
        type: boolean
        default: false
      verdict:
        description: 'Build the fund verdict table instead (tools/fund_verdict.py)'
        type: boolean
        default: false
      only:
        description: 'One part: SiftingIO freshness/client/holes/archive; verdict freshness or hours:T1,T2; eulerpool or eulerpool:newest; lse; fmp; rapidapi; google; sina or sina-fresh; dukascopy; dukascopy-dump (tickers: SYMBOL list)'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  # Research dumps: one Dukascopy symbol-year per job, side by side, because the
  # archive throttles each address to about a request every half minute. The
  # CSVs come back as artifacts. only=dukascopy-dump, tickers = the symbols.
  dukascopy-dump:
    if: inputs.only == 'dukascopy-dump'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        year: [2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Can a runner reach Binance's market-data mirror?
        if: matrix.year == 2026
        run: curl -sS -o /dev/null -w "data-api.binance.vision %{http_code}\n" "https://data-api.binance.vision/api/v3/klines?symbol=ADAUSDT&interval=1h&limit=2"
      - name: Dump
        run: |
          for s in $(echo "${{ inputs.tickers }}" | tr ',' ' '); do
            python -m tools.dukascopy_dump "$s" ${{ matrix.year }} dump/
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dukascopy-${{ matrix.year }}
          path: dump/

  probe:
    if: inputs.only != 'dukascopy-dump'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # What Alpaca can serve at all: depth per feed, which candidate tickers
      # exist, where the freshness line really falls, and whether the forex
      # endpoint answers. Needs no stored bars - it asks the provider about
      # itself.
      # Finnhub rides this workflow rather than one of its own: a workflow can
      # only be dispatched once its file is on the default branch, and this one
      # already is. Read-only, like the rest.
      - name: Probe what Finnhub serves
        if: inputs.finnhub
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python -m tools.finnhub_probe

      # Needs the checked-out bar store too: it compares against the bars held.
      - name: Probe what SiftingIO serves
        if: inputs.sifting
        env:
          SIFTING_API_KEY: ${{ secrets.SIFTING_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          SIFTING_ONLY: ${{ inputs.only }}
          SIFTING_PAIRS: ${{ inputs.tickers }}
        # The holiday calendars are a development dependency; the holes check
        # matches SiftingIO's missing hours against them.
        run: |
          pip install -q 'exchange-calendars>=4.13,<5'
          python -m tools.sifting_probe

      # Every source against the consolidated tape, per fund, held and
      # candidate. Needs Alpaca (the tape), SiftingIO and one Twelve Data
      # sample; Yahoo needs no key.
      - name: Build the fund verdict table
        if: inputs.verdict
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          SIFTING_API_KEY: ${{ secrets.SIFTING_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          FUND_VERDICT_ONLY: ${{ inputs.only }}
        run: python -m tools.fund_verdict

      # Eulerpool against the tape: shape, agreement, depth, freshness, FX and
      # crypto. Dispatched with only=eulerpool (or eulerpool:newest for the
      # freshness part alone) and probe off.
      - name: Probe what Eulerpool serves
        if: startsWith(inputs.only, 'eulerpool')
        env:
          EULERPOOL_API_KEY: ${{ secrets.EULERPOOL_API_KEY }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          EULERPOOL_ONLY: ${{ inputs.only }}
        run: python -m tools.eulerpool_probe

      # London Strategic Edge against the tape (funds), the stored bars (held
      # pairs) and SiftingIO (new pairs). Dispatched with only=lse, probe off.
      - name: Probe what London Strategic Edge serves
        if: inputs.only == 'lse'
        env:
          LSE_API_KEY: ${{ secrets.LSE_API_KEY }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          SIFTING_API_KEY: ${{ secrets.SIFTING_API_KEY }}
        run: python -m tools.lse_probe

      # Financial Modeling Prep, for what is still unsourced: TUR and RWX
      # against the tape, the ETNs' commodities, USD/BRL. only=fmp, probe off.
      - name: Probe what Financial Modeling Prep serves
        if: inputs.only == 'fmp'
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -m tools.fmp_probe

      # RapidAPI: the Metal Sentinel subscription, for nickel, aluminium and
      # tin. only=rapidapi, probe off.
      - name: Probe what the RapidAPI subscriptions serve
        if: inputs.only == 'rapidapi'
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: python -m tools.rapidapi_probe

      # Sina Finance's US fund bars against the tape, for the funds on Yahoo.
      # only=sina, probe off.
      - name: Probe Sina Finance's US bars against the tape
        if: startsWith(inputs.only, 'sina')
        env:
          SINA_PROBE_ONLY: ${{ inputs.only == 'sina-fresh' && 'fresh' || '' }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -m tools.sina_probe

      # Dukascopy's archive under the gap instruments' history: USD/BRL, KRW,
      # INR, coffee, cocoa, cotton. No key; the archive throttles a sandbox.
      # only=dukascopy, probe off; tickers narrows it.
      - name: Probe Dukascopy's archive for the gap instruments
        if: inputs.only == 'dukascopy'
        run: python -m tools.dukascopy_probe ${{ inputs.tickers }}

      # Google Finance, the feed behind a sheet's GOOGLEFINANCE(): TUR and RWX
      # against the tape. only=google, probe off.
      - name: Probe Google Finance against the tape
        if: inputs.only == 'google'
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -m tools.google_probe

      - name: Probe what Alpaca covers
        if: inputs.probe && !inputs.finnhub && !inputs.sifting && !inputs.verdict
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_FEEDS: ${{ inputs.feeds }}
        run: python -m tools.alpaca_probe

      # This one DOES need the checked-out bar store as well as the keys: the
      # whole point is to compare Alpaca's hours against the ones already held,
      # instrument by instrument. Nothing is written - read-only contents
      # permission, no commit step.
      - name: Compare Alpaca against the stored bars
        if: inputs.compare
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_TICKERS: ${{ inputs.tickers }}
          ALPACA_FEEDS: ${{ inputs.feeds }}
          ALPACA_DAYS: ${{ inputs.days }}
        run: python -m tools.alpaca_compare
