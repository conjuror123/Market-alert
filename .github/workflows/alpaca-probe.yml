# Research runs that need the repository's secrets or a runner's address, all
# read-only: nothing here commits. Manual only.
#
#   verdict          every candidate feed against the consolidated tape, per
#                    fund (tools/fund_verdict.py) - rerun after a violent month
#                    (docs/decisions.md, "Open questions")
#   only=sina        Sina's US half-hour bars against the tape
#                    (tools/sina_probe.py); only=sina-fresh for freshness alone
#   only=dukascopy-dump
#                    one Dukascopy symbol-year per job, side by side, as CSV
#                    artifacts for tools/dukascopy_futures.py
#
# The file keeps its old name: GitHub offers manual dispatch only for a
# workflow whose file is already on the default branch.
name: Research

on:
  workflow_dispatch:
    inputs:
      verdict:
        description: 'Build the fund verdict table (tools/fund_verdict.py)'
        type: boolean
        default: false
      only:
        description: 'verdict freshness or hours:T1,T2; sina or sina-fresh; dukascopy-dump'
        type: string
        default: ''
      tickers:
        description: 'dukascopy-dump: the symbols as a JSON list, e.g. ["COTTONCMDUSX"]'
        type: string
        default: ''
      days:
        description: 'dukascopy-dump: the years as a JSON list, e.g. [2019,2020]'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  # The archive throttles each address to about a request every half minute,
  # so a year is one job and the years run side by side.
  dukascopy-dump:
    if: inputs.only == 'dukascopy-dump'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        year: ${{ fromJSON(inputs.days) }}
        symbol: ${{ fromJSON(inputs.tickers) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Dump
        run: python -m tools.dukascopy_dump ${{ matrix.symbol }} ${{ matrix.year }} dump/
      - uses: actions/upload-artifact@v4
        with:
          name: dukascopy-${{ matrix.symbol }}-${{ matrix.year }}
          path: dump/

  research:
    if: inputs.only != 'dukascopy-dump'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Every source against the consolidated tape, per fund. Needs Alpaca (the
      # tape), SiftingIO and one Twelve Data sample; Yahoo needs no key.
      - name: Build the fund verdict table
        if: inputs.verdict
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          SIFTING_API_KEY: ${{ secrets.SIFTING_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          FUND_VERDICT_ONLY: ${{ inputs.only }}
        run: python -m tools.fund_verdict

      - name: Probe Sina Finance's US bars against the tape
        if: startsWith(inputs.only, 'sina')
        env:
          SINA_PROBE_ONLY: ${{ inputs.only == 'sina-fresh' && 'fresh' || '' }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -m tools.sina_probe
