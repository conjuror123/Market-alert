name: Explain Alerts

on:
  workflow_dispatch:
    inputs:
      message_id:
        description: >-
          ID of the alert to explain (the number from the "ID: ..." line in the
          Telegram message itself). Required - that way one run spends tokens on
          exactly one alert rather than on the whole outstanding queue at once.
          DeepSeek peak hours (weekdays 01:00-04:00 and 06:00-10:00 UTC =
          04:00-07:00 and 09:00-13:00 Israel summer time (IDT, UTC+3) /
          03:00-06:00 and 08:00-12:00 winter (IST, UTC+2)) - during those the
          lighter deepseek-v4-flash is used, otherwise deepseek-v4-pro (see
          price_monitor/llm.py).
        required: true
        type: string

permissions:
  contents: write

jobs:
  explain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Explain pending alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Changing the LLM provider means changing only this line (which secret
          # is substituted here) and llm_base_url/llm_model in config/config.yaml.
          # The code does not need touching, see price_monitor/llm.py.
          LLM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          EXPLAIN_MESSAGE_ID: ${{ github.event.inputs.message_id }}
        run: python -m price_monitor.explain

      - name: Commit updated alerts log
        run: |
          if [ -n "$(git status --porcelain data/alerts_log.json)" ]; then
            git config user.name "price-monitor-bot"
            git config user.email "actions@github.com"
            git add data/alerts_log.json
            git commit -m "chore: mark explained alerts [skip ci]"
            git push
          else
            echo "No alerts_log changes to commit."
          fi
