name: Explain Alerts

on:
  workflow_dispatch:
    inputs:
      message_id:
        description: >-
          ID конкретного алерта (число из строки "ID: ..." в самом сообщении в
          Telegram). Оставьте пустым, чтобы обработать все ещё не объяснённые
          алерты сразу.
        required: false
        type: string

permissions:
  contents: write

jobs:
  explain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Explain pending alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Меняете провайдера LLM - меняете только эту строку (какой секрет сюда
          # подставлен) и llm_base_url/llm_model в config/config.yaml. Код трогать
          # не нужно, см. price_monitor/llm.py.
          LLM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          EXPLAIN_MESSAGE_ID: ${{ github.event.inputs.message_id }}
        run: python -m price_monitor.explain

      - name: Commit updated alerts log
        run: |
          if [ -n "$(git status --porcelain data/alerts_log.json)" ]; then
            git config user.name "price-monitor-bot"
            git config user.email "actions@github.com"
            git add data/alerts_log.json
            git commit -m "chore: mark explained alerts [skip ci]"
            git push
          else
            echo "No alerts_log changes to commit."
          fi
