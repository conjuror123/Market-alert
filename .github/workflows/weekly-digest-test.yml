name: Test Weekly Digest

# A manual, one-off way to see the economic calendar digest right now, without
# waiting for a real Friday at 12:00 Israel time (see README, "Weekly economic
# calendar digest") - useful both for looking at the coming week and for checking
# the sending mechanism itself. `--force` bypasses the day/time check and does not
# touch "already sent this week" in state.json - this is not part of the regular
# schedule.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send weekly digest now
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m price_monitor.weekly_digest --force

      - name: Commit updated calendar history
        # Same as price-monitor.yml's own commit step: the digest still
        # merges fetched events into data/economic_calendar/ even on a
        # manual/forced run.
        if: always()
        run: |
          if [ -n "$(git status --porcelain data/economic_calendar)" ]; then
            git config user.name "price-monitor-bot"
            git config user.email "actions@github.com"
            git add data/economic_calendar
            git commit -m "chore: update economic calendar archive [skip ci]"
            git push
          else
            echo "No calendar changes to commit."
          fi
