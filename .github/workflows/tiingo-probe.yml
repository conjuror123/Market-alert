# Runs tools/tiingo_probe.py, which is the only place TIINGO_API_KEY can be
# exercised: the key is a repository secret, so a laptop or a sandbox cannot
# reach it. Read-only - the probe fetches and measures, and writes nothing.
#
# Manual only, and deliberately not on a schedule: every run spends requests
# from the same free-tier bucket the monitor would use.
name: Tiingo Probe

on:
  workflow_dispatch:
    inputs:
      # Tiingo's free tier allows 50 requests per hour, and the two passes cost
      # about 22 each. Running both twice inside one hour trips the limit, so
      # the first pass - whose questions are already answered - is opt-in.
      first_pass:
        description: 'Also run the first pass (coverage, FX, sizing)'
        type: boolean
        default: false
      second_pass:
        description: 'Also run the second pass (splits, volume, depth)'
        type: boolean
        default: false
      compare:
        description: 'Run the feed comparison'
        type: boolean
        default: true
      tickers:
        description: 'Comma-separated ETFs to compare (blank = all 44)'
        type: string
        default: ''
      fx_and_actions:
        description: 'Run the FX and corporate-action checks'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Probe Tiingo
        if: inputs.first_pass
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: python -m tools.tiingo_probe

      - name: Probe Tiingo, second pass
        if: inputs.second_pass
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: python -m tools.tiingo_probe2

      # Needs the checked-out bar store as well as the key: it compares the two
      # feeds hour by hour on the bars already held.
      - name: Compare Tiingo against the stored Twelve Data bars
        if: inputs.compare
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          TIINGO_TICKERS: ${{ inputs.tickers }}
        run: python -m tools.tiingo_compare

      - name: Check FX agreement and the declared corporate actions
        if: inputs.fx_and_actions
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: python -m tools.tiingo_fx_and_actions
