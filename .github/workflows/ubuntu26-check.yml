# Temporary: the suite and the hourly run's tools on the image ubuntu-latest
# becomes from 2026-10-19. Removed after it has run.
name: Ubuntu 26.04 check

on:
  push:
    branches: ["claude/youthful-pascal-u0rx7u"]
    paths: [".github/workflows/ubuntu26-check.yml"]

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - run: cat /etc/os-release; python --version; gh --version; tar --version | head -1; bash --version | head -1
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - run: |
          pip install "exchange-calendars>=4.13,<5"
          python -c "from jump import sessions; print('needs extension:', sessions.needs_extension())"
