name: Price Spike Monitor

on:
  # An external service (cron-job.org) triggers the hourly run by calling
  # workflow_dispatch through the GitHub API. GitHub's own schedule: is not used
  # and should not be added back - it was measured firing roughly once every ten
  # hours on this repository rather than once an hour, and a trigger that
  # unpredictably does not fire is worse than no trigger at all, because the
  # silence looks identical to a quiet market. See README, on schedule reliability.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: price-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    # The Tremor pipeline adds about three minutes to what was a forty-second
    # job. Twenty is room for a slow provider, not an expectation.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore gitignored Tremor parquet
        uses: actions/cache/restore@v4
        with:
          # metrics/ so `python -m tremor.pipeline` can extend instead of
          # rebuilding every instrument; the events archive so rate lines keep
          # history older than the six-year warm table. Both are gitignored
          # (parquet does not delta). saed_events.parquet is rewritten from
          # this run's warm score and is not cached.
          #
          # restore + save (not cache@v4) so a red job still persists: this
          # workflow fails the run when backfill did, after pipeline/saed have
          # already written. cache@v4 skips save on failure, and the next hour
          # would then rebuild every metric — scoring the whole archive.
          path: |
            data/tremor/metrics
            data/tremor/saed_events_archive.parquet
          key: tremor-derived-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            tremor-derived-${{ github.ref_name }}-

      # What the cache held when it landed, so the save at the end can tell
      # whether this run actually changed any of it.
      - name: Mark when the cache landed
        run: touch /tmp/cache-restored

      # Two steps feed the third: backfill brings the bars up to date and
      # pipeline turns them into per-asset metrics, which is what saed reads.
      #
      # TWO STEPS LEFT THIS LIST and neither is missed. `tremor.cluster` built
      # the SI-Index detector's events every hour and no module ever read them -
      # not delivery, not the digest, nothing; it is deleted. `tremor.cross_section`
      # wrote metrics_basket_hour.parquet, whose only reader WAS cluster: saed
      # imports cross_section's functions and builds its panels in memory, so the
      # file was ten megabytes written for nobody. The module stays, the step goes.
      #
      # continue-on-error so delivery still runs. A fetch failure used to abort
      # this whole script under bash -e, so pipeline and saed never wrote
      # events (gitignored; a fresh runner has no previous table) and delivery
      # sent nothing. Now pipeline and saed always run on whatever bars are
      # stored; the step still exits nonzero so the job goes red at the end.
      - name: Tremor pipeline
        id: tremor
        continue-on-error: true
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_HEALTH_CHAT_ID: ${{ secrets.TELEGRAM_HEALTH_CHAT_ID }}
        run: |
          set +e
          python -m tremor.backfill
          bf=$?
          set -e
          python -m tremor.pipeline
          python -m tremor.saed
          if [ "$bf" -ne 0 ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi
          exit "$bf"

      # Runs after the pipeline, and this order is the point: the delivery layer
      # inside it reads saed_events.parquet off disk, so it must read the file
      # this run just wrote rather than the one the last commit happened to carry.
      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_HEALTH_CHAT_ID: ${{ secrets.TELEGRAM_HEALTH_CHAT_ID }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          TREMOR_STEP_FAILED: ${{ steps.tremor.outputs.failed == 'true' || steps.tremor.outcome == 'failure' }}
        run: python -m price_monitor

      # Two different cadences, for two different kinds of file.
      #
      # Every run: the small state. data/state.json carries which Tremor events
      # have already been sent, so losing it means sending them all again. The
      # candle history and decision log that used to be committed here belonged
      # to the old per-asset detector and went with it.
      #
      # Once a day: the bar archive and the VIX store. The bars cannot be
      # rebuilt - the providers do not serve 2003 on the free plan - and they
      # APPEND, which is what makes them cheap to keep. VIX is committed so
      # skip-if-fresh can see yesterday's close and skip CBOE's full 1990 file.
      # Daily rather than hourly only because backfill re-fetches from the
      # newest bar minus a short settle window, so a day's worth is always
      # recoverable anyway.
      #
      # The derived tables used to be committed here too and are not any more.
      # A parquet of floats that the pipeline recomputes in full shares no bytes
      # with its previous version, so git stores the whole thing again every
      # time: metrics_basket_hour alone was 8.3 MB a commit, thirteen copies in
      # the pack. They are rebuilt by the run that reads them - always the same
      # run - so keeping them cost about ten megabytes a day and bought nothing.
      # See .gitignore.
      - name: Commit updated state
        run: |
          mkdir -p data/economic_calendar
          git config user.name "price-monitor-bot"
          git config user.email "actions@github.com"
          # data/tremor/ladder.csv used to be committed here too. The ladder was
          # a fitted tail that needed either the whole archive or a cache of
          # earlier fits, and a runner is thrown away after each run, so an
          # uncommitted cache was a cache that never existed. A rung is now the
          # biggest move in its own lookback, which a trailing slice answers in
          # one pass - there is nothing left to carry between runs, and naming a
          # file that no longer exists would fail this step every hour.
          git add data/state.json data/economic_calendar config/basket.yaml
          # Every run, and small: which payouts are known and how far each
          # fund's record is confirmed. An overnight gap is scored only on a
          # date its fund has been checked through, and a runner is thrown
          # away after each run - so an uncommitted check is one that never
          # happened, and the next morning would ask again from the old date.
          git add data/tremor/corporate_actions.csv data/tremor/dividend_checks.csv
          # THE BARS GO IN ONCE A WEEK. Git cannot delta parquet, so a commit
          # stores every byte of whatever shard changed, and committing daily
          # spends seven times the bytes to record the same week. Nothing is
          # risked by waiting: the bars on a runner never come from the last
          # commit alone, because backfill asks each provider from the newest
          # STORED bar forward. A week-old checkout is simply a week-wide
          # request, and a week is far inside every provider's reach - Tiingo
          # serves 365 days, Yahoo 55 at thirty minutes.
          #
          # Saturday 04:00 UTC, so every market that keeps a session is shut and
          # the week being written down is a whole one.
          if [ "$(date -u +%H)" = "04" ] && [ "$(date -u +%u)" = "6" ]; then
            git add data/tremor/bars data/tremor/vix 2>/dev/null || true
          fi
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: update monitor state [skip ci]"
            # A rejected push leaves the next checkout with the old sent map
            # and re-delivers every push still inside 48 hours. Rebase onto
            # whatever landed and try again, same loop as the bars persist.
            for attempt in 1 2 3 4 5; do
              if git push origin "HEAD:${{ github.ref_name }}"; then
                echo "pushed on attempt $attempt"
                exit 0
              fi
              echo "push rejected, rebasing onto origin/${{ github.ref_name }}"
              git pull --rebase origin "${{ github.ref_name }}" || exit 1
              sleep $((attempt * 3))
            done
            echo "::error::could not push monitor state after 5 attempts"
            exit 1
          fi

      # Last, so that a Tremor failure still leaves the monitor's own work done
      # and committed - but the run goes red, because the alternative is a
      # pipeline that quietly stops updating while the repository looks healthy.
      # That is the exact shape of the failure this whole workflow exists to fix.
      - name: Fail the run if the Tremor pipeline did not complete
        if: steps.tremor.outcome == 'failure'
        run: |
          echo "::error::The Tremor pipeline failed; events were not refreshed."
          exit 1

      # 232 MiB went up on every run of every hour - 5.4 GiB a day spent
      # re-stating what the last run already said. The pipeline skips writing a
      # metrics file whose numbers did not move, so on a quiet hour there is
      # nothing new to upload; anything newer than the marker was written here.
      # On a cache miss the metrics do not exist yet, everything is written, and
      # the answer is yes - which is what we want.
      - name: Did the derived data change
        id: derived
        if: always()
        run: |
          changed=$(find data/tremor/metrics data/tremor/saed_events_archive.parquet \
                      -newer /tmp/cache-restored -type f -print -quit 2>/dev/null || true)
          # Once a day whatever happened, so a long quiet stretch cannot let the
          # entry age out from under us: GitHub drops a cache nothing has
          # touched for a week, and a cold start costs every instrument a full
          # rebuild. The upload is not worth betting the warm start on.
          if [ -n "$changed" ] || [ "$(date -u +%H)" = "04" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "nothing written this run; keeping the restored cache as it is"
          fi

      - name: Persist gitignored Tremor parquet
        if: always() && steps.derived.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            data/tremor/metrics
            data/tremor/saed_events_archive.parquet
          key: tremor-derived-${{ github.ref_name }}-${{ github.run_id }}
