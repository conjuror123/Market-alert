name: Price Spike Monitor

on:
  # Раньше здесь было ещё и собственное расписание GitHub Actions (schedule: cron
  # "5 * * * *"), но GitHub исполняет его крайне нестабильно на малоактивных
  # репозиториях (см. README) — по факту раз в ~10 часов вместо раза в час. Вместо
  # этого запуск раз в час теперь делает внешний сервис (cron-job.org), дёргая
  # workflow_dispatch через GitHub API — см. README, раздел про надёжность
  # расписания.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: price-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m price_monitor

      - name: Commit updated state
        run: |
          if [ -n "$(git status --porcelain data/state.json data/alerts_log.json)" ]; then
            git config user.name "price-monitor-bot"
            git config user.email "actions@github.com"
            git add data/state.json data/alerts_log.json
            git commit -m "chore: update monitor state [skip ci]"
            git push
          else
            echo "No state changes to commit."
          fi
