name: Price Spike Monitor

on:
  # This used to carry a GitHub Actions schedule of its own (schedule: cron
  # "5 * * * *"), but GitHub runs those very unreliably on low-activity
  # repositories (see README) - in practice once every ~10 hours instead of once
  # an hour. Instead an external service (cron-job.org) now triggers the hourly
  # run by calling workflow_dispatch through the GitHub API - see README, the
  # section on schedule reliability.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: price-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python -m price_monitor

      - name: Commit updated state
        run: |
          mkdir -p data/candle_history data/decision_log data/economic_calendar
          if [ -n "$(git status --porcelain data/state.json data/alerts_log.json data/candle_history data/decision_log data/economic_calendar)" ]; then
            git config user.name "price-monitor-bot"
            git config user.email "actions@github.com"
            git add data/state.json data/alerts_log.json data/candle_history data/decision_log data/economic_calendar
            git commit -m "chore: update monitor state [skip ci]"
            git push
          else
            echo "No state changes to commit."
          fi
