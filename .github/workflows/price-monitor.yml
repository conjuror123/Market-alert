name: Price Spike Monitor

on:
  schedule:
    # Раз в час, через 5 минут после начала часа — даёт источникам данных (Coinbase,
    # Yahoo Finance) время закрыть и проиндексировать часовую свечу перед запросом.
    - cron: "5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: price-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m price_monitor

      - name: Commit updated state
        run: |
          if [ -n "$(git status --porcelain data/state.json data/alerts_log.json)" ]; then
            git config user.name "price-monitor-bot"
            git config user.email "actions@github.com"
            git add data/state.json data/alerts_log.json
            git commit -m "chore: update monitor state [skip ci]"
            git push
          else
            echo "No state changes to commit."
          fi
