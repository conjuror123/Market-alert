name: Price Spike Monitor

on:
  # The external trigger (cron-job.org calling workflow_dispatch through the
  # GitHub API) remains the primary schedule - see README, the section on
  # schedule reliability. The GitHub schedule below is a BACKUP, added after the
  # external one stopped firing on 2026-09-01 and nothing noticed for six days.
  # GitHub's own schedules run late and sometimes skip, which is why they are not
  # the primary; late is still enormously better than never.
  #
  # IT ONLY FIRES ON THE DEFAULT BRANCH. GitHub ignores schedule: on every other
  # branch, silently, so this line is a no-op until the branch carrying it is the
  # repository default - which is worth knowing before trusting it as a backup.
  workflow_dispatch: {}
  schedule:
    - cron: "20 * * * *"

permissions:
  contents: write

concurrency:
  group: price-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    # The Tremor pipeline adds about three minutes to what was a forty-second
    # job. Twenty is room for a slow provider, not an expectation.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Everything Tremor needs, in the one order that works: cross_section
      # reads the per-asset metrics, saed reads the basket factor, and cluster
      # ENRICHES metrics_basket_hour.parquet in place - so skipping it does not
      # merely omit a step, it leaves the file stripped of the eighteen columns
      # cluster writes into it. Found the hard way; see docs/pre-launch-review.md.
      #
      # continue-on-error because price_monitor is the incumbent and must not be
      # taken down by a break in the system being built beside it. A failure here
      # leaves the events table as it was, and delivery's own staleness rule
      # (48 hours) then sends nothing rather than something wrong. The job is
      # failed at the end regardless, so a silent breakage is not possible.
      - name: Tremor pipeline
        id: tremor
        continue-on-error: true
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python -m tremor.backfill
          python -m tremor.pipeline
          python -m tremor.cross_section
          python -m tremor.saed
          python -m tremor.cluster

      # Runs after the pipeline, and this order is the point: the delivery layer
      # inside it reads saed_events.parquet off disk, so it must read the file
      # this run just wrote rather than the one the last commit happened to carry.
      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python -m price_monitor

      # Two different cadences, for two different kinds of file.
      #
      # Every run: the small state. data/state.json carries which Tremor events
      # have already been sent, so losing it means sending them all again.
      #
      # Once a day: the bar archive and the event tables. Parquet rewrites a file
      # in full, so git stores a whole new blob for every changed one - hourly
      # that is gigabytes a month for no new facts. The archive is the one thing
      # here that cannot be rebuilt (the providers do not serve 2003 on the free
      # plan, which is why it was assembled from Dukascopy in the first place),
      # but it only ever grows forward, and backfill re-fetches whatever the
      # store is missing from its newest bar. So a day's worth is always
      # recoverable and committing it hourly buys nothing.
      - name: Commit updated state
        run: |
          mkdir -p data/candle_history data/decision_log data/economic_calendar
          git config user.name "price-monitor-bot"
          git config user.email "actions@github.com"
          git add data/state.json data/alerts_log.json data/candle_history \
                  data/decision_log data/economic_calendar
          if [ "$(date -u +%H)" = "04" ]; then
            git add data/tremor/bars data/tremor/saed_events.parquet \
                    data/tremor/saed_block_alerts.parquet \
                    data/tremor/market_events.parquet \
                    data/tremor/metrics_basket_hour.parquet \
                    data/tremor/cluster_events.parquet 2>/dev/null || true
          fi
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: update monitor state [skip ci]"
            git push
          fi

      # Last, so that a Tremor failure still leaves the monitor's own work done
      # and committed - but the run goes red, because the alternative is a
      # pipeline that quietly stops updating while the repository looks healthy.
      # That is the exact shape of the failure this whole workflow exists to fix.
      - name: Fail the run if the Tremor pipeline did not complete
        if: steps.tremor.outcome == 'failure'
        run: |
          echo "::error::The Tremor pipeline failed; events were not refreshed."
          exit 1
