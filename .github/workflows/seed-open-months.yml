name: Seed the open months

# One-off, deleted once done: the open months of the bar store, from the first
# repository's release (conjuror123/Market-alert-old, archived), saved as this
# repository's - the 62 instruments' only. Run once before the first hourly run.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/seed-open-months.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: price-monitor
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lay down the first repository's open months
        run: |
          set -euo pipefail
          url=$(curl -sS https://api.github.com/repos/conjuror123/Market-alert-old/releases/tags/bars-live-claude-price-spike-monitoring-app-yyg2jg \
            | python -c "import sys, json; a = sorted(json.load(sys.stdin)['assets'], key=lambda x: x['created_at'])[-1]; print(a['browser_download_url'])")
          echo "archive: $url"
          curl -sSfL -o "$RUNNER_TEMP/open.tar.gz" "$url"
          tar -xzf "$RUNNER_TEMP/open.tar.gz"
          PYTHONPATH=. python -c "
          import os, shutil
          from jump.basket import load_basket
          stems = {a.file_stem for a in load_basket().instruments}
          root = 'data/jump/bars'
          gone = [d for d in os.listdir(root) if d not in stems]
          for d in gone:
              shutil.rmtree(os.path.join(root, d))
          kept = [d for d in os.listdir(root) if any(f.endswith('.open.csv') for f in os.listdir(os.path.join(root, d)))]
          print(f'{len(kept)} stores with open months; {len(gone)} left behind')
          missing = sorted(stems - set(kept))
          assert not missing, f'no open month for {missing}'
          "
      - name: Save them as this repository's
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/hot_bars.sh save
