name: Backfill Candle History

# A manual, one-off (or occasionally repeated) backfill of the permanent local
# price history (data/candle_history/, see README) to whatever depth --since sets
# - unlike price-monitor.yml, which every hour merely appends the latest candle.
# A Twelve Data key is needed for the currency pairs; it is used only inside this
# workflow (the secret is never visible in the logs or anywhere outside), which
# makes this a safe way to backfill history without pasting the key into a chat
# again.

on:
  workflow_dispatch:
    inputs:
      since:
        description: 'Backfill history from this date (YYYY-MM-DD)'
        required: false
        default: '2021-01-01'
        type: string

permissions:
  contents: write

# Same group as price-monitor.yml, deliberately: both hit the same Twelve
# Data account and its shared 8-credits/minute limit, so they must never run
# at the same time - a real collision (verified live) made both jobs 429 at
# once when the external hourly trigger fired mid-backfill.
concurrency:
  group: price-monitor
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backfill
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python -m price_monitor.backtest --since "${{ github.event.inputs.since }}"

      - name: Commit updated candle history
        # Runs even if the step above failed partway through (rate limit,
        # transient error) - whatever was fetched and merged for earlier
        # assets in this run already cost real API credits and must not be
        # thrown away just because a later asset in the same run failed.
        if: always()
        run: |
          if [ -n "$(git status --porcelain data/candle_history)" ]; then
            git config user.name "price-monitor-bot"
            git config user.email "actions@github.com"
            git add data/candle_history
            git commit -m "chore: backfill candle history since ${{ github.event.inputs.since }} [skip ci]"
            git push
          else
            echo "No history changes to commit."
          fi
