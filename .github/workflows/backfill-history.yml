name: Backfill Candle History

# Ручной, разовый (или изредка повторяемый) докач постоянной локальной истории
# цен (data/candle_history/, см. README) на глубину, которую задаёт --since -
# в отличие от price-monitor.yml, который каждый час только дописывает
# последнюю свечу. Нужен ключ Twelve Data для валютных пар - он используется
# только внутри этого workflow (секрет никогда не виден ни в логах, ни за его
# пределами), поэтому это безопасный способ докачать историю, не вставляя ключ
# в чат заново.

on:
  workflow_dispatch:
    inputs:
      since:
        description: 'Докачать историю с этой даты (YYYY-MM-DD)'
        required: false
        default: '2021-01-01'
        type: string

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backfill
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python -m price_monitor.backtest --since "${{ github.event.inputs.since }}"

      - name: Commit updated candle history
        run: |
          if [ -n "$(git status --porcelain data/candle_history)" ]; then
            git config user.name "price-monitor-bot"
            git config user.email "actions@github.com"
            git add data/candle_history
            git commit -m "chore: backfill candle history since ${{ github.event.inputs.since }} [skip ci]"
            git push
          else
            echo "No history changes to commit."
          fi
