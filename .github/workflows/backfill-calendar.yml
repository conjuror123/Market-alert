name: Backfill Economic Calendar

# Ручной, разовый импорт локального архива календаря (data/economic_calendar/,
# см. README) за годы, которые задают since-year/until-year - в отличие от
# price-monitor.yml, который раз в неделю (см. weekly_digest.py) добавляет
# только текущую неделю с фида ForexFactory. ForexFactory сам отдаёт только
# "эту неделю" и блокирует скрейпинг архива Cloudflare'ом, а Financial
# Modeling Prep (пробовали как платную альтернативу) оказался платным даже на
# "stable" тарифе (see README) - поэтому историю берём из готового CSV-дампа
# ForexFactory, лежащего на GitHub (raw.githubusercontent.com, не за
# Cloudflare, без ключа).

on:
  workflow_dispatch:
    inputs:
      since_year:
        description: 'Первый год для импорта (включительно)'
        required: true
        type: string
      until_year:
        description: 'Последний год (включительно), по умолчанию - since_year'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run calendar backfill
        run: |
          python -m price_monitor.economic_calendar --import-spoluan \
            --since-year "${{ github.event.inputs.since_year }}" \
            ${{ github.event.inputs.until_year != '' && format('--until-year {0}', github.event.inputs.until_year) || '' }}

      - name: Commit updated calendar history
        # Same reasoning as backfill-history.yml's commit step: keep whatever
        # was fetched and merged for earlier years in this run even if a
        # later year fails partway through.
        if: always()
        run: |
          if [ -n "$(git status --porcelain data/economic_calendar)" ]; then
            git config user.name "price-monitor-bot"
            git config user.email "actions@github.com"
            git add data/economic_calendar
            git commit -m "chore: import economic calendar history since ${{ github.event.inputs.since_year }} [skip ci]"
            git push
          else
            echo "No calendar changes to commit."
          fi
