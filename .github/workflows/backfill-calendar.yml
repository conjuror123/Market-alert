name: Backfill Economic Calendar

# Ручная пересборка локального архива календаря (data/economic_calendar/,
# см. README). Штатное пополнение идёт иначе: weekly_digest раз в неделю
# добавляет текущую неделю с живого фида ForexFactory и дочитывает факт за
# текущий и прошлый месяц с помесячных страниц. Этот workflow нужен, когда
# архив надо собрать заново целиком или закрыть большой пробел.
#
# Источников два, оба без ключа: датасет "Global Economic Calendar" на Kaggle
# (2020-01-01 .. 2025-10-01, CC BY-NC-SA 4.0) и помесячные страницы самой
# ForexFactory дальше. Прежние три дампа (spoluan, ehsan) сняты вместе с их
# данными - у них четверть событий High и Medium оказалась сдвинутыми копиями
# (см. economic_calendar.py и docs/meals-otstupleniya.md, п.11).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Что делать'
        required: true
        default: 'rebuild'
        type: choice
        options:
          - rebuild            # выбросить архив и собрать заново: Kaggle + ForexFactory
          - import-kaggle      # только исторический датасет
          - import-forexfactory  # только помесячный добор
      from_month:
        description: 'Первый месяц добора с ForexFactory, YYYY-MM (по умолчанию 2025-10)'
        required: false
        default: ''
        type: string
      to_month:
        description: 'Последний месяц добора, YYYY-MM (по умолчанию текущий)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run calendar backfill
        run: |
          python -m price_monitor.economic_calendar \
            --${{ github.event.inputs.mode }} \
            ${{ github.event.inputs.from_month != '' && format('--from-month {0}', github.event.inputs.from_month) || '' }} \
            ${{ github.event.inputs.to_month != '' && format('--to-month {0}', github.event.inputs.to_month) || '' }}

      - name: Commit updated calendar history
        # Same reasoning as backfill-history.yml's commit step: keep whatever
        # was fetched and merged so far in this run even if a later step
        # fails partway through.
        if: always()
        run: |
          if [ -n "$(git status --porcelain data/economic_calendar)" ]; then
            git config user.name "price-monitor-bot"
            git config user.email "actions@github.com"
            git add data/economic_calendar
            git commit -m "chore: import economic calendar history [skip ci]"
            git push
          else
            echo "No calendar changes to commit."
          fi
