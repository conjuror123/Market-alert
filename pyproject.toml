[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    # Tests of the actual backfill itself: an autouse fixture in
    # test_weekly_digest.py stubs backfill_actuals everywhere except these, so the
    # digest tests never touch the network.
    "real_backfill: the test exercises backfill_actuals rather than the stub",
]
